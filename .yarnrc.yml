nodeLinker: node-modules

enableGlobalCache: true

npmRegistryServer: "https://registry.npmjs.org"

# React 18 is installed under a second name so that `packages/route-collector`
# can serve a React 18 fixture out of a repository whose own React is 19. An
# alias does not carry peer links: `react-dom-18` asks for a `react` its
# dependent has no way to name, so the copy it needs is given to it directly.
packageExtensions:
  "react-dom@^18.3.1":
    dependencies:
      react: "^18.3.1"
