name: build
description: Build with an exact native binary or reusable Cargo dependencies.

inputs:
  toolchain:
    description: Resolved Rust version of this run's native producer.
    default: ''
  native-key:
    description: Identity of the binary uploaded by this run's base job.
    default: ''
  native-tests:
    description: Restore Cargo dependencies even on a binary hit, for native tests.
    default: 'false'
  native-run:
    description: Another run of this tree whose `variance-native` artifact the build takes when build.mjs's stamp says it is current.
    default: ''

outputs:
  native-tree:
    description: git's tree id for packages/sense/native at HEAD.
    value: ${{ steps.native.outputs.tree }}
  toolchain:
    description: Resolved Rust release used to build the native scanner.
    value: ${{ steps.native.outputs.toolchain }}
  native-inputs:
    description: Git identity of all compiled native inputs.
    value: ${{ steps.native.outputs.inputs }}
  native-key:
    description: Native inputs, resolved compiler, platform, architecture and the glibc it links against.
    value: ${{ steps.native.outputs.key }}

runs:
  using: composite
  steps:
    # Resolve the toolchain before either cache: `stable` can change without
    # changing the crate's tree. The dependency cache also keys on rustc.
    - name: a compiler for the native scanner
      shell: bash
      run: |
        command -v cargo >/dev/null && exit 0
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: use the producer's compiler
      if: inputs.toolchain != ''
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        rustup toolchain install "$TOOLCHAIN" --profile minimal
        echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

    - name: name the native build
      id: native
      shell: bash
      working-directory: packages/sense/native
      env:
        PLATFORM: ${{ runner.os }}-${{ runner.arch }}
      run: |
        inputs=$(node --input-type=module -e '
          import { appendFileSync } from "node:fs";
          import { nativeBuildInputs } from "./build-inputs.mjs";
          const inputs = nativeBuildInputs("../../..");
          if (!inputs?.clean) throw new Error("CI native inputs have no clean git identity");
          appendFileSync(process.env.GITHUB_OUTPUT, `tree=${inputs.tree}\ninputs=${inputs.identity}\n`);
          process.stdout.write(inputs.identity);
        ')
        libc=$(ldd --version 2>/dev/null | awk 'NR == 1 { print $NF }' || true)
        # build.mjs links this host's binary at its target's glibc floor with
        # the pinned linker, which makes it independent of the runner's glibc
        # and names the linker, as the binary's stamp does.
        floor=$(node --input-type=module -e 'import { hostTarget } from "./targets.mjs"; process.stdout.write(hostTarget()?.glibc ?? "")')
        echo "floor=$floor" >> "$GITHUB_OUTPUT"
        linked=$(FLOOR=$floor node --input-type=module -e 'import { linkedAt } from "./targets.mjs"; const f = process.env.FLOOR; process.stdout.write(f ? linkedAt(f).replaceAll(" ", "-") : "")')
        compiler=$(rustc -vV | sha256sum | cut -d ' ' -f 1)
        echo "toolchain=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
        rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
        echo "libc=${libc:-none}" >> "$GITHUB_OUTPUT"
        echo "key=sense-native-v2-$PLATFORM-${linked:-libc-${libc:-none}}-$compiler-$inputs" >> "$GITHUB_OUTPUT"

    # A run hands its binary directly to compatible jobs. A different tree or
    # environment falls through to its own cache/build, never a guessed binary.
    - name: take this run's native scanner
      id: download
      if: inputs.native-key != '' && inputs.native-key == steps.native.outputs.key
      uses: actions/download-artifact@v8
      with:
        name: variance-native
        path: packages/sense/npm

    # A run of another event on the same tree, such as the merge-queue run of
    # the commit a push landed: its cache is scoped to a ref this run cannot
    # read, so its artifact is the only way to its binary. The key cannot be
    # compared across runs, since each resolves its own compiler, so the
    # binary is laid down and build.mjs, which owns the stamp, says below
    # whether it is current: the compiled inputs' tree, the glibc floor and the
    # pinned linker, not the compiler.
    - name: take another run's native scanner
      id: borrowed
      if: inputs.native-run != '' && steps.download.outcome != 'success'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: variance-native
        path: packages/sense/npm
        run-id: ${{ inputs.native-run }}
        github-token: ${{ github.token }}

    # Asked before either cache, so a borrowed binary that is not current
    # falls through to the cache and Cargo's dependencies as any miss does.
    - name: is the borrowed scanner current
      id: current
      if: steps.borrowed.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        scanner=$(node packages/sense/native/build.mjs --compiles)
        cli=$(node packages/sense/native/build.mjs --cli --compiles)
        if [ "$scanner" = false ] && [ "$cli" = false ]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        fi

    - name: restore the native scanner
      id: cache
      if: steps.download.outcome != 'success' && steps.current.outputs.current != 'true'
      uses: actions/cache@v6
      with:
        path: |
          packages/sense/npm/*/scan.node
          packages/sense/npm/*/scan.node.tree
          packages/sense/npm/*/variance.exe
          packages/sense/npm/*/variance.exe.tree
        key: ${{ steps.native.outputs.key }}

    # Cache compiled dependencies across source edits, rather than starting
    # Cargo from nothing on every binary miss. rust-cache keys the resolved
    # compiler, manifests, lockfiles and build flags; libc separates the host
    # from containers with a different linker floor. Native-test jobs keep
    # their debug dependencies separately, so a release-only producer cannot
    # win a save race and discard them. Cargo owns freshness.
    - name: restore Cargo compilation
      if: (steps.cache.outputs.cache-hit != 'true' && steps.download.outcome != 'success' && steps.current.outputs.current != 'true') || inputs.native-tests == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/sense/native
        shared-key: sense-${{ runner.os }}-${{ runner.arch }}-libc-${{ steps.native.outputs.libc }}-tests-${{ inputs.native-tests }}
        cache-on-failure: 'true'
        cache-bin: 'false'

    # The linker for a target's glibc floor, which build.mjs refuses to build
    # without in CI. Only when build.mjs says it will compile: it owns the
    # stamp, and a binary an earlier lookup left on disk may not be current.
    - name: will the native scanner compile
      id: compiles
      if: steps.native.outputs.floor != ''
      shell: bash
      run: |
        scanner=$(node packages/sense/native/build.mjs --compiles)
        cli=$(node packages/sense/native/build.mjs --cli --compiles)
        if [ "$scanner" = true ] || [ "$cli" = true ]; then
          echo "native=true" >> "$GITHUB_OUTPUT"
        else
          echo "native=false" >> "$GITHUB_OUTPUT"
        fi

    - name: a linker for the glibc floor
      if: steps.compiles.outputs.native == 'true'
      uses: ./.github/actions/zigbuild

    # build.mjs checks the restored binary's compiled-input stamp before skipping Cargo.
    - name: build
      shell: bash
      run: yarn build
