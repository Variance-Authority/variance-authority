name: ripgrep
description: >-
  `rg` on PATH, at the release pinned here, for the tests that hand files to
  ripgrep.

# `docs_grep` shells out to `rg`, and neither the hosted runner nor the
# Playwright image carries it. Its tests skip on a developer's machine without
# it and fail on CI without it, as
# `packages/help/src/__fixtures__/ripgrep-on-path.ts` decides, so every job
# that runs them takes this step, and a job that runs them without it goes red
# naming this directory.
#
# The release's static musl binary, not the distribution's package: one file
# runs the same on the bare runner and in the image, as the runner's user or as
# root, with no package index to fetch and no `sudo`. The version and the
# checksum are pinned together, so the bytes that run are the bytes reviewed;
# moving the version means moving the checksum the release publishes beside it.

runs:
  using: composite
  steps:
    - name: name the ripgrep release
      shell: bash
      env:
        VERSION: 15.2.0
        SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        # The release asset's id, for the API route below.
        ASSET: 478120097
      run: |
        set -euo pipefail
        # The pinned binary is the x86-64 Linux one; a runner it does not run on
        # is refused here rather than at the first test.
        if [ "$RUNNER_OS" != Linux ] || [ "$RUNNER_ARCH" != X64 ]; then
          echo "::error::the pinned ripgrep is for Linux X64, and this runner is $RUNNER_OS $RUNNER_ARCH"
          exit 1
        fi
        name="ripgrep-$VERSION-x86_64-unknown-linux-musl"
        {
          echo "RIPGREP_NAME=$name"
          echo "RIPGREP_TARBALL=$RUNNER_TEMP/$name.tar.gz"
          echo "RIPGREP_SHA256=$SHA256"
          echo "RIPGREP_ASSET=$ASSET"
        } >> "$GITHUB_ENV"
    # github.com's release download goes on answering 504 for minutes at a time
    # while the API serves the same asset, so the tarball comes through the API
    # once per checksum and is kept in the cache, saved as soon as it checks out
    # rather than when the job ends green.
    - name: ripgrep from the cache
      id: cached
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.RIPGREP_TARBALL }}
        key: ripgrep-${{ env.RIPGREP_SHA256 }}
    - name: ripgrep download
      if: steps.cached.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 -sSfL --retry 5 -o "$RIPGREP_TARBALL" \
          -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
          "https://api.github.com/repos/BurntSushi/ripgrep/releases/assets/$RIPGREP_ASSET"
        echo "$RIPGREP_SHA256  $RIPGREP_TARBALL" | sha256sum --check --strict -
    - name: ripgrep to the cache
      if: steps.cached.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.RIPGREP_TARBALL }}
        key: ripgrep-${{ env.RIPGREP_SHA256 }}
    - name: ripgrep
      shell: bash
      run: |
        set -euo pipefail
        echo "$RIPGREP_SHA256  $RIPGREP_TARBALL" | sha256sum --check --strict -
        tar -xzf "$RIPGREP_TARBALL" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$RIPGREP_NAME" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/$RIPGREP_NAME/rg" --version
