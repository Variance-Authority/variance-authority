[package]
name = "sense-native"
version = "0.0.0"
edition = "2021"
publish = false
description = "The scanning path of @variance-authority/sense, where a cold repository is the cost."

[lib]
crate-type = ["cdylib"]

# The instrumenter is its own crate so that a Rust transform pipeline can depend
# on it from `node_modules`; this addon is one of its two callers. The vendored
# resolver is a patch, not a member.
[workspace]
members = ["instrument"]
exclude = ["vendor"]

# The tree-sitter grammars, which are the only part of this crate that can fail
# to build for a reason that is not ours. Each grammar ships a C parser compiled
# by a `cc` invocation on the adopter's or the runner's machine, so a toolchain
# the five generated parsers disagree with takes the whole scanner down with
# them — and the scanner is mostly oxc, which reads the languages this product
# is actually about.
#
# On by default, because a release that quietly dropped them would be a release
# that lost Python, Rust, Java, Kotlin and Swift. Off is a fallback the build
# script reaches for after the default build has already failed
# (`build.mjs`), and it costs exactly those five languages: the batch
# records every file in them as unknown (`read_any.rs`).
[features]
default = ["grammars"]
grammars = [
    "dep:tree-sitter",
    "dep:tree-sitter-java",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-swift",
]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
# The sharded map and the hasher `oxc_resolver` caches paths with, so the
# layouts `Emitted` keeps beside that cache cost what it costs.
dashmap = "6"
# The matcher `oxc_resolver` already builds, and the one rolldown reads a
# `sideEffects` glob with.
fast-glob = "1"
# git's index and object store, read in-process: a tracked file the index holds
# as unchanged is inflated out of its pack instead of opened (`git_store.rs`).
gix-hash = { version = "=0.28.0", features = ["sha1"] }
gix-index = { version = "=0.57.0", features = ["sha1"] }
gix-object = "=0.66.0"
gix-odb = { version = "=0.86.0", features = ["sha1"] }
# `status` in-process (`worktree_status.rs`): the index against the worktree,
# and the untracked files beside it, under the repository's ignore rules.
bstr = { version = "1", default-features = false, features = ["std"] }
gix-command = "=0.12.1"
gix-dir = "=0.31.0"
gix-error = "=0.5.2"
gix-filter = { version = "=0.36.0", default-features = false }
gix-fs = "=0.24.1"
gix-ignore = "=0.24.1"
gix-path = "=0.14.1"
gix-parallel = { version = "=0.50.1", features = ["parallel"] }
gix-pathspec = "=0.22.1"
gix-status = { version = "=0.36.0", default-features = false, features = ["sha1"] }
gix-utils = "=0.5.2"
gix-worktree = { version = "=0.58.0", default-features = false }
# ripgrep's searcher and its regex matcher: `ask grep` and `discover` search
# text in-process, with ripgrep's pattern language, encodings and binary rules.
grep-regex = "0.1"
grep-searcher = "0.1"
# The comment and trailing-comma stripper `oxc_resolver` reads a `tsconfig` with,
# so `customConditions` is read from the same text it parses.
json-strip-comments = "3"
# The SIMD substring search a name question scans the lowered name table with.
memchr = "2"
oxc_allocator = { version = "0.157.0", features = ["pool"] }
oxc_ast = "0.157.0"
oxc_ast_visit = "0.157.0"
oxc_parser = "0.157.0"
oxc_resolver = "=11.24.3"
oxc_semantic = "0.157.0"
oxc_span = "0.157.0"
oxc_syntax = { version = "0.157.0", features = ["to_js_string"] }
rayon = "1"
# Holds an opened chain's layers beside the segment bytes they borrow, which
# `oxc_resolver` already builds with.
self_cell = "1"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Git's name for a blob, to tell bytes read off the disk from the blob the listing named.
sha1 = "0.11"
sha2 = "0.11"
variance-sense-instrument = { path = "instrument", features = ["addon"] }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
zstd = "0.14"

# oxc_resolver deep-copies a tsconfig's `paths` into every config that extends
# it and normalises the copy once per config, so a monorepo whose base declares
# thousands of aliases over a thousand package configs held gigabytes of the
# same map during a cold scan. The vendored copy shares the map and its built
# form. It also keeps a tsconfig that failed to load per path, as upstream
# keeps one that loaded, so an unbootstrapped monorepo stops re-reading a
# broken config for every file (216k reads of 1,585 configs on Kibana).
# Resolution answers are the upstream ones; both deltas are re-applied on an
# upgrade (`src/cache/cache_impl.rs`: `tsconfigs_failed`).
# TODO: drop the patch once upstream shares an inherited `paths` map and
# caches a failed load.
[patch.crates-io]
oxc_resolver = { path = "vendor/oxc_resolver" }

[build-dependencies]
napi-build = "2"

# The unit tests link a test executable, not the addon, and no Node process is
# there to supply the `napi_*` symbols: the addon's link leaves them undefined
# for the host to fill at `dlopen` (`napi-build` says so to the linker on macOS),
# and an executable cannot. `dyn-symbols` is napi's own default, which this crate
# turns off for the addon: with it the bindings are function pointers the module
# fills from the host when Node registers it, so the executable references no
# symbol it cannot resolve. A feature named here is enabled for the test targets
# only (resolver 2), so the released binary is built as it was.
[dev-dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# The addon's allocator on macOS and Linux (`large_alloc.rs`): jemalloc for the
# small blocks, whose pages the system allocators keep resident once freed, and
# `mmap`, `munmap` and `mremap` for a large block, which they keep resident too.
# Node loads the addon with `dlopen`, after startup, where glibc may have no
# static TLS left for jemalloc's initial-exec model.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
tikv-jemallocator = { version = "0.7", features = ["disable_initial_exec_tls"] }

# The tests' dependencies, oxc above all, built optimised: the instrument crate
# walks every installed module through the parser, and a debug parser made that
# one test cost a minute of CPU. Our own crates stay debug, so a failing
# assertion still reads as written; the release build is untouched.
[profile.test.package."*"]
opt-level = 2
