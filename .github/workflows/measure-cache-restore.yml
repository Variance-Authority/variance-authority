name: measure-cache-restore
on:
  push:
    branches: [measure/cache-restore]
permissions:
  contents: read
jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: a public Jest suite transformed by babel-jest (jestjs/jest)
        run: |
          set +e -x
          git clone -q --depth 1 https://github.com/jestjs/jest /tmp/d
          cd /tmp/d && git log -1 --format='jest %H'
          corepack enable; yarn --version
          yarn install --immutable > /tmp/install.log 2>&1; echo "install exit $?"; tail -15 /tmp/install.log
          yarn build:js > /tmp/build.log 2>&1; echo "build exit $?"; tail -10 /tmp/build.log
          nproc; node packages/jest-cli/bin/jest.js --ci packages --shard=1/3 --cacheDirectory /tmp/probe 2>&1 | grep -E -m3 -A20 "FAIL|^Tests:"
          rm -rf /tmp/probe; true
      - name: cold, warm, and restored shard 1/3
        run: |
          cd /tmp/d
          drop() { sync; echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null; }
          j() { drop; /usr/bin/time -f "$1: %e s real, %U s user, %S s sys" node packages/jest-cli/bin/jest.js --ci --silent packages --shard=1/3 --cacheDirectory /tmp/jc 2>&1 | grep -E "^(Tests:|Test Suites:|$1)"; }
          for r in 1 2; do
            rm -rf /tmp/jc
            j "cold $r"
            j "warm $r"
            echo "cache: $(find /tmp/jc -type f | wc -l) files, $(du -sm /tmp/jc | cut -f1) MB"
            tar -C /tmp/jc -cf - . | zstd -3 -q -o /tmp/jc.tar.zst -f; echo "pack: $(du -sm /tmp/jc.tar.zst | cut -f1) MB"
            rm -rf /tmp/jc; mkdir /tmp/jc; drop
            s=$(date +%s.%N); zstd -dc /tmp/jc.tar.zst | tar -xf - -C /tmp/jc; e=$(date +%s.%N); echo "restore $r: $(echo "$e - $s" | bc) s"
            j "restored $r"
          done
