name: outer loop

# The three review flows, driven end to end the way a consumer meets them, each
# against the example repository that carries it:
#
#   cache     Variance-Authority/example-storybook   a label accepts
#   lfs       Variance-Authority/example-static-site the label's run commits the images
#   tribunal  Variance-Authority/example-tribunal    a decision on the deployment accepts
#
# Per flow, `.github/scripts/outer-loop.mjs` opens two pull requests there: one
# that changes what a subject renders, and a control that changes nothing any
# subject reaches. It waits for their checks, holds what they posted against
# `outer-loop/flows.mjs`, accepts the change the way the flow accepts, waits for
# the check to turn green, and closes both pull requests and deletes their
# branches whatever happened. Every expectation is in the script and its tests,
# none of it here.
#
# A failing flow opens an issue labelled `outer-loop-e2e` here, or comments on
# the one already open, and the next run that passes closes it.

on:
  schedule:
    # Monday morning, at a minute nobody else's cron picks. `schedule` runs
    # only on the default branch.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      flow:
        description: Which review flow to drive.
        type: choice
        options: [all, cache, lfs, tribunal]
        default: all

# The example repositories are reached with VARIANCE_PUSH_TOKEN, not with this
# token, which only reads this checkout and files the issue.
permissions:
  contents: read
  issues: write

# One outer loop at a time: two would race each other's approvals on the
# tribunal deployment and each other's label runs in the examples.
concurrency:
  group: outer-loop
  cancel-in-progress: false

jobs:
  flow:
    name: ${{ matrix.flow }}
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJSON((inputs.flow == '' || inputs.flow == 'all') && '["cache","lfs","tribunal"]' || format('["{0}"]', inputs.flow)) }}
    runs-on: ubuntu-24.04
    # The flow step's minutes and ten for settle, so settle always gets to sweep
    # and file after the flow step is stopped. A test holds both numbers.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: flow
        name: drive the flow
        # The tribunal's budget (two 40-minute waits), its restore (one more) and
        # ten minutes for requests: `jobMinutes` in the script. A flow stopped
        # here is a failure, filed by settle.
        timeout-minutes: 130
        env:
          OUTER_LOOP_FLOW: ${{ matrix.flow }}
          VARIANCE_PUSH_TOKEN: ${{ secrets.VARIANCE_PUSH_TOKEN }}
          # A decision on the deployment is the tribunal flow's accept; no other
          # flow is handed the token.
          VARIANCE_REVIEW_TOKEN: ${{ matrix.flow == 'tribunal' && secrets.VARIANCE_REVIEW_TOKEN || '' }}
        run: node .github/scripts/outer-loop.mjs run

      # Runs after a failure and after a cancel too: it closes what a cancelled
      # run left open, and files the outcome.
      - name: settle
        if: always()
        env:
          OUTER_LOOP_FLOW: ${{ matrix.flow }}
          OUTER_LOOP_OUTCOME: ${{ steps.flow.outcome }}
          VARIANCE_PUSH_TOKEN: ${{ secrets.VARIANCE_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/outer-loop.mjs settle
