<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 280" role="img" aria-labelledby="title desc">
  <title id="title">Variance Authority README heading</title>
  <desc id="desc">A horizontal heading lockup for GitHub README with the Variance Authority mark and product name.</desc>

  <defs>
    <style>
      .ribbon-dark {
        fill: #24282A;
      }

      .ribbon-orange {
        fill: #FF4A19;
      }

      .ribbon-orange-shadow {
        fill: #D83A13;
        opacity: 0.82;
      }

      .headline-main {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-size: 92px;
        font-weight: 300;
        letter-spacing: 16px;
        fill: #24282A;
      }

      .headline-accent {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-size: 92px;
        font-weight: 500;
        letter-spacing: 16px;
        fill: #FF4A19;
      }

      @media (prefers-color-scheme: dark) {
        .ribbon-dark {
          fill: #F3F4F6;
        }

        .headline-main {
          fill: #F3F4F6;
        }
      }
    </style>
  </defs>

  <g transform="translate(32 18) scale(0.68)">
    <path class="ribbon-dark" d="M64 54H159L256 266H160Z"/>
    <path class="ribbon-dark" d="M331 28H419L494 266H397Z"/>
    <path class="ribbon-orange" d="M256 266L202 152L283 28H376L301 165Z"/>
    <path class="ribbon-orange-shadow" d="M202 152L256 266L301 165L264 103Z"/>
  </g>

  <g transform="translate(430 48)">
    <text class="headline-main" x="0" y="78">VARIANCE</text>
    <text class="headline-accent" x="0" y="188">AUTHORITY</text>
  </g>
</svg>
