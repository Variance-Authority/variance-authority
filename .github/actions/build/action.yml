name: build
description: >-
  `yarn build`, with the native scanner restored from the cache when nothing it
  is built from has changed.

# The native scanner is most of what `yarn build` costs on a runner: `cargo`
# compiles the crate and its dependency graph from nothing, about three minutes,
# for a binary that is the same one every time `packages/sense/native` is. So
# the binary is cached, keyed by git's tree id for that directory — every input
# `cargo` reads lives there, and git already knows whether any of it moved.
#
# The cache carries the binary and the tree it was built from. The build script
# reads that stamp and skips `cargo` only when it matches the checkout, and
# prints that it did; a miss, or a stamp that does not match, is an ordinary
# build. Nothing here decides whether to build: this step only puts back what a
# previous run left, and `build.mjs` owns the decision.
#
# The key also names the C library the binary links against, as `ldd` reports
# it. The same workflows build on the bare runner and inside the Playwright
# image, and a binary linked against a newer glibc than the host's does not load
# there; the runner's OS name alone does not tell those two apart. A host with
# no `ldd` names `none`.
#
# The tree id is also this action's output, for a step that asks the same
# question of the crate: `check.yml` skips the crate's unit tests on it.

outputs:
  native-tree:
    description: git's tree id for `packages/sense/native` at `HEAD`.
    value: ${{ steps.native.outputs.tree }}

runs:
  using: composite
  steps:
    - name: name the native tree
      id: native
      shell: bash
      run: |
        # On its own line, so a git that refuses the checkout fails the step:
        # inside `echo` it would key the cache on an empty tree, which restores
        # whichever scanner was saved under that key first.
        tree=$(git rev-parse HEAD:packages/sense/native)
        echo "tree=$tree" >> "$GITHUB_OUTPUT"
        # `awk` reads to the end: a `head` would close the pipe on `ldd`, which
        # `pipefail` then reports as the step failing with SIGPIPE.
        libc=$(ldd --version 2>/dev/null | awk 'NR == 1 { print $NF }' || true)
        echo "libc=${libc:-none}" >> "$GITHUB_OUTPUT"

    - name: restore the native scanner
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          packages/sense/npm/*/scan.node
          packages/sense/npm/*/scan.node.tree
        key: sense-native-${{ runner.os }}-${{ runner.arch }}-libc-${{ steps.native.outputs.libc }}-${{ steps.native.outputs.tree }}

    # A miss means `build.mjs` compiles the crate, and the Playwright image the
    # browser jobs run in carries no compiler: without one the build skips the
    # scanner, and every step that reads source fails to load it. A pull request
    # that changes the crate always misses here until some job with a compiler
    # has built that tree, so the jobs that have none install one rather than
    # race for the cache. The hosted runners carry `cargo`, and there this is a
    # no-op.
    - name: a compiler for the native scanner
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        command -v cargo >/dev/null && exit 0
        if ! command -v cc >/dev/null || ! command -v curl >/dev/null; then
          apt-get update && apt-get install -y --no-install-recommends build-essential curl ca-certificates
        fi
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: build
      shell: bash
      run: yarn build
