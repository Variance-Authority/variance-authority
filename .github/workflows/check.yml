name: check

# This repository's own gate.
#
# These jobs run the suite and the repository's own rules, one job per harness.
# The suite runs in the CI image, the pinned Playwright image with
# this repository's tools, built from `docker/ci.Dockerfile`, so the chromium
# slice is recorded, selected and compared like the other two. Until they existed, nothing ran `yarn build`, `yarn check` or `yarn test`
# anywhere but a laptop, so `tools/boundaries.check.ts` and the
# `tools/docs-*.check.ts` rules were enforcing themselves only against whoever
# happened to type the command.
#
# `.github/workflows/variance.yml` answers the other half: it observes
# `cases/storybook-case` in a pinned container and gates on what moved. Both are
# this repository's gates. A green check here is still not a green suite, and a
# green variance run is about twelve stories in a fixture rather than about this
# project's own interface.

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue on `main` runs this on each group, whose commit is the pull
  # request laid on `main` and the groups queued ahead of it. With `check`
  # required on `main`, the queue merges a group only when it is green, so two
  # pull requests green on their own bases cannot break what `check` tests
  # together through the queue. A group runs `plan` and the `queue` jobs
  # alone: lint and the repository's rules in one, and in the others, a shard
  # each, as many as `plan` counts the group's change is worth, the
  # tests within two imports of what it changes, `verify:near`'s wave. Every
  # pull request in it already ran its own whole selection, and the push to
  # `main` after it runs every file, so the queue asks only whether the group's
  # changes break each other's neighbours.
  # It publishes nothing.
  merge_group:
  workflow_dispatch:

# `pull-requests: write` is for the review comment and nothing else. A pull
# request from a fork gets a read-only token whatever this says; the comment step
# warns and continues there, and the review is still in the job summary and the
# run's artifacts. `issues: read` is for the `idea` job, which reads the labels
# of the issue a pull request closes.
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: write

# A pull request's newer push supersedes its older one, so the group is the ref
# and the older run is cancelled. On `main` every commit's run publishes that
# commit's record, and a merge that cancels the one before it leaves that commit
# with none, so there the group is the commit and no run is cancelled by another.
concurrency:
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    # The repository's own rules, read as data: lint, and the `tools/*.check.ts`
    # suite. The cheapest failures there are, so they report while the suite is
    # still installing. The carry contract and the native crate's unit tests run
    # after them, for the reasons written at their steps. A merge group runs
    # `queue` instead.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04

    steps:
      # Every commit and no trees: the `changeset` step below asks from where
      # the branch left its base, and a merge base is exact only when the whole
      # commit graph is there to find it in. A depth cut can end at an older
      # common ancestor once a branch has merged its base in. A diff fetches
      # the trees and blobs it reads, so the history costs megabytes where
      # `fetch-depth: 0` alone costs the repository.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # 24, and only 24.
      #
      # This was a `['22', '24']` matrix, added because a pin at 22 had hidden a
      # bug the image found: a remote call built its `AbortSignal` from whatever
      # realm a jsdom test environment had installed, which the newer runtime
      # brand-checks and refuses. The lesson there was that CI must run the
      # runtime something actually runs on, and the matrix was one answer to it.
      #
      # The 22 leg was never the answer it looked like. `setup-node` resolves
      # `'22'` to the newest 22 there is, so the leg tested a runtime that moves
      # under it and never once tested the floor the packages declare. It was a
      # second modern Node, bought at twice the runner time.
      #
      # So the floor is now a claim and not a check: `sense` and its dependents
      # say `>=22.15` because that is where `zlib.zstdCompressSync` arrived, and
      # nothing here proves a 22.15 install works. Stating that is the point of
      # this comment. What is tested is 24, which this step also holds in the
      # container jobs, where the image's own Node is 26.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      # A pull request that changes a published package carries a changeset, or
      # an empty one saying the change ships nothing a changelog should name.
      # Most of the pull requests merged after 0.12.0 had none, and the release
      # they were headed for described two of them. Which files
      # count as a change to a package is `changedFilePatterns` in
      # `.changeset/config.json`: tests, fixtures and a package's own README and
      # changelog do not.
      #
      # The version pull request is the one change that removes changesets
      # rather than adding them, so it is not asked. It is recognised by its
      # branch and by coming from this repository: a fork can name a branch
      # `changeset-release/main` too, and is asked like any other.
      - name: changeset
        if: ${{ github.event_name == 'pull_request' && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: yarn changeset status --since="origin/$BASE"

      # Build first, and not only to catch type errors: the documentation check
      # compiles each README example against each package's built `.d.ts`,
      # because that is the file a consumer's editor resolves (ADR-0014). A
      # checker reading `src` would pass on things the published types refuse.
      - uses: ./.github/actions/build
        id: build
        with:
          native-tests: true

      # Before the checks because it is the fastest of the two and its failures
      # are the cheapest to act on: an unused import is a one-line fix.
      - name: lint
        shell: bash
        run: yarn lint

      # In its own job rather than before the suite, so a repository in an
      # illegal state — a dangling link, an undeclared import, a file past the
      # size limit — is reported in seconds whatever the suite does. These are
      # checks and not tests: they exercise no behaviour and have no subject,
      # they read the repository as data. `yarn test` used to run them too, and
      # over half of what it reported as passing tests was this.
      - name: check
        shell: bash
        run: yarn check

      # The import fences in each `.relations.json`: a runner-neutral file that
      # reads one runner's integration is the first step of bending toward it.
      - name: restrictions
        shell: bash
        run: yarn restrictions

      # The journeys that carry a record through a history of edits and runs,
      # asked in-process and through the CLI after a restart. They run here by
      # path, not by selection: `suite` runs what Variance selects from the
      # record `main` saved, and a defect in carrying is a defect in that record,
      # so a selection read from it is the one answer this contract cannot trust.
      # They need the build this job already made — the CLI journeys run
      # `packages/cli/dist/bin.js` — and nothing else, so they are a step here
      # rather than a job that installs and builds again. The paths are what
      # carrying is read and written by: the selection and the instrumenter in
      # `sense`, the native layer, and the CLI's commands that compare records.
      # A push to `main` always runs them. Like the native tests, they run
      # after a red rule, because a failing link check says nothing about
      # carrying.
      #
      # A failed walk keeps its directory — the texts, the actions, the record
      # and each expectation beside what came back — under the artifacts path,
      # and the step after uploads it.
      - name: carry contract
        id: carry-contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CARRY_CONTRACT_ARTIFACTS: ${{ runner.temp }}/carry-contract
        run: |
          set -euo pipefail
          if [ -n "$BASE" ] && [ -z "$(git diff --name-only "$BASE" HEAD -- \
            packages/sense packages/core/src packages/cli/src/commands \
            .github/workflows/check.yml)" ]; then
            echo "carry contract skipped: nothing it reads changed since $BASE"
            exit 0
          fi
          mkdir -p "$CARRY_CONTRACT_ARTIFACTS"
          # The two runs share nothing but the build, so they run side by
          # side, each into its own log, printed whole once both have ended.
          yarn vitest run packages/sense/src/test-selection/carry-contract.test.ts packages/sense/src/test-selection/carry-harness.test.ts \
            > "$CARRY_CONTRACT_ARTIFACTS/in-process.log" 2>&1 &
          in_process=$!
          yarn vitest run --config vitest.integration.config.mts packages/sense/src/test-selection/carry-contract.integration.test.ts \
            > "$CARRY_CONTRACT_ARTIFACTS/cli.log" 2>&1 &
          cli=$!
          status=0
          wait "$in_process" || status=1
          wait "$cli" || status=1
          cat "$CARRY_CONTRACT_ARTIFACTS/in-process.log" "$CARRY_CONTRACT_ARTIFACTS/cli.log"
          exit "$status"

      - name: keep the failed walks
        if: ${{ !cancelled() && steps.carry-contract.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: carry-contract-walks
          path: ${{ runner.temp }}/carry-contract
          if-no-files-found: ignore

      # The native crates' own unit tests, the `#[cfg(test)]` modules under
      # `packages/sense/native`, and one build of the instrumenter crate as a
      # project's Rust pipeline links it, from `node_modules`. `yarn test`
      # reaches the crates only through the built addon, so these are the only
      # runs of their tests. They are here
      # rather than in `suite` because a cold debug build of the crate is a few
      # minutes: this job ends minutes before the suite does, so the step
      # lengthens nothing, and `suite` stays the unit suite's harness. The step
      # runs after a red rule too, because a failing link check says nothing
      # about the crate.
      #
      # On a pull request that leaves the crate as its base had it, the step
      # skips, and says so. The tests also read the record layout Rust
      # compiles from outside `packages/sense/native`. The build action names
      # both compiled inputs; those and the `test:native` command in
      # `packages/sense/package.json` decide whether a source edit needs them.
      # `HEAD` here is the pull request merged into its base, so the identity
      # matches exactly when the pull request changed no compiled input.
      #
      # The toolchain file names `stable`, not a version, so a Rust release can
      # change the answer with no file moving. A push to `main` therefore always
      # runs, and so does a pull request whose base cannot be read: a base that
      # is not there is not a base that matches.
      - name: native unit tests
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          INPUTS: ${{ steps.build.outputs.native-inputs }}
        run: |
          command_at() {
            git show "$1:packages/sense/package.json" 2>/dev/null | node -e '
              const script = JSON.parse(require("fs").readFileSync(0, "utf8")).scripts?.["test:native"];
              if (typeof script !== "string") process.exit(1);
              console.log(script);
            ' 2>/dev/null
          }
          if [ -n "$BASE" ] && [ -n "$INPUTS" ]; then
            git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --quiet --depth=1 origin "$BASE" || true
            base_inputs=$(node --input-type=module -e '
              import { nativeBuildInputs } from "./packages/sense/native/build-inputs.mjs";
              process.stdout.write(nativeBuildInputs(process.cwd(), process.env.BASE)?.identity ?? "");
            ')
            base_command=$(command_at "$BASE" || true)
            head_command=$(command_at HEAD || true)
            if [ -n "$base_inputs" ] && [ "$base_inputs" = "$INPUTS" ] && [ -n "$base_command" ] && [ "$base_command" = "$head_command" ]; then
              echo "native unit tests skipped: native compiled inputs are $INPUTS and test:native is \`$head_command\` both here and at the base $BASE"
              exit 0
            fi
          fi
          yarn workspace @variance-authority/sense test:native

  measure:
    # Timed on a machine nothing else is running on. The suite instruments every
    # module it loads and heats the machine doing it, so a bound on what the
    # product costs is read in its own job rather than after three hundred files.
    # A merge group times nothing: no group's change moves a bound the pull
    # requests in it did not already move.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Node 24, for the reason written at the same step in `rules`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      - uses: ./.github/actions/build

      # The cost arguments, timed. Separate from the suite because the suite
      # instruments every product module it loads, and a bound on how long the
      # product takes cannot be read through the thing reading it — see
      # `vitest.measure.config.ts`. Its own job because a machine that has just
      # run three hundred files is not the one these numbers describe.
      - name: measure
        shell: bash
        run: yarn measure

  base:
    # The mainline's record of every shared suite, read once for the whole run
    # and handed to every job that reads one. `refs/variance/mainline/main` is
    # a line, and a line is its latest: the `publish` job of the previous push
    # to `main` can move it while this run's suite jobs are starting. Read by
    # each job on its own, two jobs of one run read two records, select from
    # two bases, and hand on records `record` then refuses to fold. Read here
    # once, every job lays the same base. A merge group runs neither this nor
    # the jobs that need it: `plan` reads the line once for its `queue` jobs.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    # Whether the upload made an artifact. The artifact's id rather than the
    # step's outcome, for the reason written at the same output in `record`:
    # a job told nothing was uploaded takes nothing, and a job told something
    # was stops when it cannot download it.
    outputs:
      legs: ${{ steps.count.outputs.legs }}
      native-key: ${{ steps.scanner.outputs.native-key || steps.initial.outputs.native-key }}
      toolchain: ${{ steps.scanner.outputs.toolchain || steps.initial.outputs.toolchain }}
      carried: ${{ steps.carry.outputs.artifact-id != '' }}
      # The commit every job of a pull request's run merges its head with: the
      # one the mainline's records were made at, when the head merged with it,
      # and the merge commit this job made, which every other job's must be.
      baseline: ${{ steps.merge.outputs.merged == 'true' && steps.read.outputs.commit || '' }}
      checkout: ${{ steps.merge.outputs.checkout }}

    steps:
      # Every commit, because the read says how far behind HEAD the record was
      # published. No trees, for the reason written at the checkout in `rules`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      # Node 24, for the reason written at the same step in `rules`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      - uses: ./.github/actions/build
        id: initial

      # What the line answers, read once and written where the jobs below are
      # handed it: the record, or the line's answer that it gave none. A miss is
      # the run's answer as much as a record is; a job that asked again could
      # read a record published since. Whatever stopped the read is handed too,
      # a missing credential included; only a suite not given to the share is
      # left out.
      #
      # The read also names the commit the records were made at, which a pull
      # request's head is merged with below: one commit, or none when the suites'
      # records were made at different commits.
      - name: read the mainline once
        id: read
        shell: bash
        run: node packages/cli/dist/bin.js carry hand "$RUNNER_TEMP/base" --format github >> "$GITHUB_OUTPUT"

      # Tried here once for the run, and its answer handed on: a head that
      # conflicts with the record's commit stays merged with the base tip in
      # every job, and the others are told which commit this merge made. The
      # CLI is the one built above from the host's merge, the pull request's
      # own code, as `carry hand` is.
      - name: merge the head with the record's commit
        id: merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          COMMIT: ${{ steps.read.outputs.commit }}
        run: node packages/cli/dist/bin.js carry merge "$COMMIT" --on-conflict stay --format github >> "$GITHUB_OUTPUT"

      - name: hand the read on
        id: hand
        uses: actions/upload-artifact@v7
        with:
          name: variance-base
          path: ${{ runner.temp }}/base
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # What this pull request's last push ran, as its `record` job left it in
      # the Actions cache. A second push then runs what changed since the first
      # ran, and every file the first left incomplete, a failed one included:
      # what a selected run does between two runs on a laptop. Without it,
      # every push is measured from `main`, and a fix reruns the whole change.
      #
      # A pull request's caches are scoped to it: only its own later runs read
      # them. Each push saves under a key of its own, because a cache is never
      # overwritten, and the prefix restores the newest. One unused for seven
      # days is evicted, and the push after that reads `main`'s record, as a
      # first push does: a pull request lives hours or days, not months.
      #
      # The keys are `variance carry`'s, as a user's workflow reads them.
      # Read after the mainline, which an own layer would answer in its place.
      - name: what to carry
        id: plan
        shell: bash
        run: node packages/cli/dist/bin.js carry restore --format github >> "$GITHUB_OUTPUT"

      - name: what the last push ran
        if: steps.plan.outputs.pushed-key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.plan.outputs.pushed-path }}
          key: ${{ steps.plan.outputs.pushed-key }}
          restore-keys: ${{ steps.plan.outputs.pushed-restore-keys }}

      # The record names the commits its tests last ran at, the merge commits
      # of earlier pushes, which no ref holds. `carry keep` kept the ones no
      # remote holds beside the records, and `carry take` reads them before it
      # fetches the rest by name. A suite whose commits cannot be had is left,
      # reads `main`'s record, and is removed from the directory, which then
      # names what was taken. A taken record is re-based on the read handed
      # above and written back, so the directory handed on holds the bytes
      # `plan` prices; checked once here, so every job reads the same.
      - name: check what the last push ran
        id: taken
        if: steps.plan.outputs.pushed-key != ''
        shell: bash
        run: node packages/cli/dist/bin.js carry take --format github >> "$GITHUB_OUTPUT"

      - name: hand the last push on
        id: carry
        if: steps.taken.outputs.taken != ''
        uses: actions/upload-artifact@v7
        with:
          name: variance-carried
          path: ${{ steps.plan.outputs.pushed-path }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: reconcile the merged install
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        run: yarn install --immutable

      - uses: ./.github/actions/build
        id: scanner
        if: steps.merge.outputs.merged == 'true'

      - name: hand the native scanner on
        uses: actions/upload-artifact@v7
        with:
          name: variance-native
          path: |
            packages/sense/npm/*/scan.node
            packages/sense/npm/*/scan.node.tree
          if-no-files-found: error
          retention-days: 30

      # Lay the record the suite jobs are handed: what the last push ran, taken
      # above, or else the mainline's. `share` lays every suite the root config
      # gives to the share. Prices and
      # collection are read after the merge, on the suite jobs' own tree.
      - name: keep the planning records
        shell: bash
        run: node packages/cli/dist/bin.js share

      - name: plan suite jobs
        id: count
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SETUP: '100'
          BUDGET: '240'
        run: node tools/plan-suites.mjs

  suite:
    # One shard of one slice per job, `1/1` when one job fits, in the CI image `variance.yml`
    # runs in: the pinned Playwright image with this repository's tools, built
    # from `docker/ci.Dockerfile`. The image carries the browser, so the
    # chromium slice runs here like the other two and its record is shared like
    # theirs: a pull request selects its chromium files and compares their
    # execution with `main`'s. The image decides the raster: the browser and its
    # fonts are part of what the `cases/*` files assert, and they run here, in
    # the unit and chromium slices, and in `queue`, in no job of their own.
    #
    # `base` prices the selection from the record a leg selects from, and
    # shards it to fit the budget. It runs whole only when nothing prices the
    # selection, or when the selection misses the budget and a sharded whole
    # run is faster. No job installs merely to skip. A shard reads the record
    # `base` gave it and writes only what it ran; `record` folds the parts
    # over that same record.
    #
    # Not `fail-fast`: a red unit shard says nothing about chromium, and a
    # cancelled job reports nothing.
    needs: base
    name: suite (${{ matrix.suite }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.base.outputs.legs) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/variance-authority/ci:33602dc5866e9770c88223131f3057d61611d121
      # Chromium's renderers need more shared memory than a container's default.
      options: --ipc=host

    steps:
      # Every commit, because the reading diffs each test from the commit it
      # last ran at, which can be any number of commits back. No trees, for the
      # reason written at the checkout in `rules`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # Node 24, for the reason written at the same step in `rules`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # `actions/checkout` trusts the workspace only in a throwaway HOME it
      # removes afterwards, and the cases run their own child processes under
      # the job's HOME. Git refuses a directory it does not trust, and the
      # cases would then fall back to naming files from their own directory.
      - name: trust the workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The head merged with the commit the mainline's record was made at, as
      # `base` merged it, so the selection measures the pull request's change
      # alone. The CLI that merges is the host's merge's, as `base` ran it,
      # built alone, since the install and the build below read the merge.
      - name: a CLI to merge with
        if: github.event_name == 'pull_request'
        shell: bash
        run: corepack enable && yarn install --immutable && yarn tsc --build packages/cli

      - name: merge the head with the record's commit
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          COMMIT: ${{ needs.base.outputs.baseline }}
          EXPECT: ${{ needs.base.outputs.checkout }}
        run: node packages/cli/dist/bin.js carry merge "$COMMIT" --expect "$EXPECT"

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      - uses: ./.github/actions/build
        with:
          native-key: ${{ needs.base.outputs.native-key }}
          toolchain: ${{ needs.base.outputs.toolchain }}

      # For `docs_grep`'s tests, which are unit tests and fail on CI without
      # `rg` rather than skip. The other slices load none of them.
      - uses: ./.github/actions/ripgrep
        if: matrix.suite == 'unit'

      # The subjects the cases' chromium files observe. Without them every case
      # in those files fails on CI, and before it did they skipped: every
      # shard went green, and `publish` refused the record, since a file whose
      # cases all skipped never ran at this commit.
      - uses: ./.github/actions/case-subjects
        if: matrix.suite == 'chromium'

      # The mainline's records as `base` read them. A download that fails
      # fails the job: going on would ask the line on its own, the read `base`
      # is there to replace.
      - uses: actions/download-artifact@v8
        with:
          name: variance-base
          path: ${{ runner.temp }}/base

      # Lays each suite's read, a record or a miss, as read now. Finding
      # none of what `base` wrote, it stops the job.
      - name: take the base
        shell: bash
        run: node packages/cli/dist/bin.js carry receive "$RUNNER_TEMP/base"

      # What this pull request's last push ran, as `base` checked it, laid with
      # `--as-base` where the read sits: the shard selects from it, as `plan`
      # priced, and its own layer stays empty for what it runs. The selection
      # diffs each test from the commit it last ran at. A suite `base` handed
      # on and this job cannot take stops `carry take`, and the job with it.
      - uses: actions/download-artifact@v8
        if: needs.base.outputs.carried == 'true'
        with:
          name: variance-carried
          path: ${{ runner.temp }}/carried

      - name: take what the last push ran
        if: needs.base.outputs.carried == 'true'
        shell: bash
        run: node packages/cli/dist/bin.js carry take "$RUNNER_TEMP/carried" --as-base

      # A pull request runs its selection, in as many shards as `plan` counts
      # and one, `1/1`, when one job fits, unless no record prices it or the
      # selection misses the budget where a sharded whole run is faster; `plan`
      # says which. Otherwise it runs the whole suite.
      # `VARIANCE_AUTHORITY_SINCE` turns on the selection the slice's config is
      # wrapped in: it diffs each test from the commit it last ran at, which for
      # a record the mainline made whole is the commit it was published at, and
      # Vitest runs the files whose recorded regions the change entered. When
      # the reading cannot be made, the shard runs whole and the run says why.
      #
      # The selection runs in two waves, the legs `verify:near` and
      # `verify:far` run on a laptop: the tests within two imports of the
      # change, then the rest. A red near wave ends the step before the far
      # wave spends minutes saying less. Every wave selects and places from the
      # record the steps above laid where the read sits, the one `plan` priced,
      # beneath whatever this shard has already run, and Vitest cuts the
      # selected files the same way in every leg. A job of one shard is no
      # exception: were it to select from its own layer, its far wave would
      # read what the near wave landed at HEAD, and run again every file the
      # near wave did not. A run under
      # `--shard` records alone: its own layer starts empty and keeps only what
      # its waves ran, the far wave landing over the near one, so `record`
      # folds the parts over that same record, and every file and case no part
      # ran keeps the row it had. A shard killed before it lands hands nothing
      # on, and the build fails with it.
      #
      # A push to `main` and a dispatch run every file. That is the gate a
      # selection is a smaller claim than, and on a push it is what the record
      # `main` publishes is cut from: every file observed at `main`'s own
      # commit, so the next pull request selects from rows no older than its
      # base. Its shards record alone, as a selection's do, and every shard
      # places its files by the times the same record holds; none asks the
      # line.
      - name: test
        id: test
        shell: bash
        env:
          SELECT: ${{ matrix.mode == 'selected' }}
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SELECT" = true ]; then
            yarn variance index
            VARIANCE_AUTHORITY_SINCE='' VARIANCE_AUTHORITY_AT_DISTANCE=0-2 VARIANCE_AUTHORITY_PLACE_AT_DISTANCE=0- yarn "test:$SUITE" --shard "$SHARD"
            VARIANCE_AUTHORITY_SINCE='' VARIANCE_AUTHORITY_AT_DISTANCE=3- VARIANCE_AUTHORITY_PLACE_AT_DISTANCE=0- yarn "test:$SUITE" --shard "$SHARD"
          else
            yarn "test:$SUITE" --shard "$SHARD"
          fi

      # What this job recorded, for `record` to fold: the part the shard ran, as
      # it stands in this checkout's layer, under the `suites/<suite>/` that
      # says whose record it is. A red run still recorded what it ran, and the
      # review is where a reviewer reads why. A job that stopped before the
      # test uploads nothing, and a shard that selected nothing has nothing to.
      - name: hand the shard on
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: variance-shard-${{ matrix.suite }}-${{ strategy.job-index }}
          path: node_modules/.cache/variance-authority/test-selection/*/suites/${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  record:
    # The suite's record of this change, made whole again from the jobs that
    # ran it, and read: every shard's record laid over the mainline's, the
    # review of the change, and on a push to `main` the records handed to
    # `publish`. It runs when a suite job failed too, for the reason written
    # at the upload steps above.
    needs: [base, suite]
    if: ${{ !cancelled() && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    # `contents: write` is for the badge the review step publishes on a push to
    # `main`, the way an adopter's job grants it to the action's `badge` input.
    # A job's permissions cannot depend on its event, so a pull request's run
    # holds it too; a fork's token is read-only whatever this says, and a
    # branch of this repository is pushed by somebody who can already write.
    # The clone keeps no token, as the checkout below says.
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: write
    outputs:
      shared: ${{ steps.carry.outputs.shared-suites }}
      # The artifact's id rather than the step's outcome: an upload with no
      # files succeeds and makes no artifact.
      handed: ${{ steps.hand.outputs.artifact-id != '' }}

    steps:
      # Every commit, because the review below diffs from a base it does not
      # choose: on a pull request the commit the mainline's record was made at,
      # or the base tip when the head conflicts with it, and on `main` the
      # commit the previous push left, which can be any number of commits back. No trees,
      # for the reason written at the checkout in `rules`. Nothing here pushes,
      # so the token is not left in the clone beside the install scripts and
      # the build; the comment step hands its own token to the script that
      # posts.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      # Node 24, for the reason written at the same step in `rules`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The checkout the suite jobs ran, made by the same CLI, for the reasons
      # written at the same steps in `suite`.
      - name: a CLI to merge with
        if: github.event_name == 'pull_request'
        shell: bash
        run: corepack enable && yarn install --immutable && yarn tsc --build packages/cli

      - name: merge the head with the record's commit
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          COMMIT: ${{ needs.base.outputs.baseline }}
          EXPECT: ${{ needs.base.outputs.checkout }}
        run: node packages/cli/dist/bin.js carry merge "$COMMIT" --expect "$EXPECT"

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      - uses: ./.github/actions/build
        with:
          native-key: ${{ needs.base.outputs.native-key }}
          toolchain: ${{ needs.base.outputs.toolchain }}

      # Where the change starts, asked of `variance carry` rather than spelled
      # here. The root `variance.config.json` declares the suites and gives some
      # to the share, which `carry` names as `shared-suites` and gives no cache
      # key: their records travel through `variance share`, on this
      # repository's own git remote.
      #
      # The base: on a pull request the checkout is the merge of its head into
      # the commit the mainline's record was made at, or else into the base
      # tip, and the merge's first parent is that commit, so the change is the
      # pull request's own. On a push it is the commit the push replaced.
      - name: what to carry
        id: carry
        shell: bash
        run: node packages/cli/dist/bin.js carry restore --format github >> "$GITHUB_OUTPUT"

      # Each artifact in a directory named after it.
      - uses: actions/download-artifact@v8
        with:
          pattern: variance-shard-*
          path: ${{ runner.temp }}/ran

      # The mainline's records as `base` read them, for the reason written at
      # the same steps in `suite`.
      - uses: actions/download-artifact@v8
        with:
          name: variance-base
          path: ${{ runner.temp }}/base

      - name: take the base
        shell: bash
        run: node packages/cli/dist/bin.js carry receive "$RUNNER_TEMP/base"

      # What the last push ran, taken as the suite jobs took it, so the shards
      # fold over the record they ran from. The review still compares with
      # `main`: the cases the fold replaces are the last push's, so the
      # mainline's cases `take` names, the record it set aside or the share's,
      # are passed to it.
      - uses: actions/download-artifact@v8
        if: needs.base.outputs.carried == 'true'
        with:
          name: variance-carried
          path: ${{ runner.temp }}/carried

      - name: take what the last push ran
        id: carried
        if: needs.base.outputs.carried == 'true'
        shell: bash
        run: node packages/cli/dist/bin.js carry take "$RUNNER_TEMP/carried" --format github >> "$GITHUB_OUTPUT"

      # Each suite's record, made whole from the parts its shards handed on.
      # `share`, handed every part, lays the mainline's record of each suite
      # the root config gives to the share, the one the suite jobs read,
      # passed over as they passed it over, and lands the parts of that suite
      # over it as `variance journeys --suite` lands shards, printing only the
      # landing: nobody reads a whole journal in a log. A suite nothing handed
      # on keeps the base, and on a push the publish refuses it as recorded at
      # another commit. A shard that selected nothing hands nothing on, and
      # when none handed anything the download makes no directory, so it is
      # made here, empty.
      - name: fold the shards
        id: records
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ran"
          node packages/cli/dist/bin.js share "$RUNNER_TEMP/ran"

      # What the change did, read from what the suite just recorded: the edits,
      # the changed regions no case covered or only a distant test covered, the
      # cases added and removed, and what changed before any import and beyond
      # this repository's own code.
      #
      # The suite kept the cases it replaced, and the commit they were recorded
      # at, so what `main` moved after that commit is left out of the comparison
      # whichever recording the restore found. When the last push's record was
      # taken, the cases replaced are that push's, and the mainline's are named
      # with `--against` instead.
      #
      # The changed regions are read from every declared suite, so a region only
      # an integration case ran is not listed as run by no case; the runs, the
      # base and the freshness are the unit slice's. Coverage is carried for
      # every declared suite, each with its own denominator and baseline.
      #
      # The source index is published first. Under CI a reader refuses to build
      # it on demand, and the review asks it which tests import each changed file.
      - name: review the change
        id: review
        uses: ./.github/actions/variance/review
        with:
          command: node packages/cli/dist/bin.js
          suite: unit
          against: ${{ steps.carried.outputs.against-unit }}
          badge: true

      - name: keep the review
        if: ${{ !cancelled() && steps.review.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: variance-review
          path: ${{ steps.carry.outputs.review }}

      # What this push ran, for the pull request's next push to read from: the
      # step `what the last push ran` in `base` says why. A red suite is kept
      # too, since the files it left incomplete are what the next push reruns.
      # Saved only when the copy finished: a part-copied record is not one.
      # A checkout merged with the record's commit is a commit no remote
      # holds, so `carry keep` keeps it beside the records, with every commit
      # it needs that the pull request's base does not have.
      - name: what this push keeps
        id: save
        if: ${{ !cancelled() && steps.records.outcome == 'success' }}
        shell: bash
        run: node packages/cli/dist/bin.js carry save --format github >> "$GITHUB_OUTPUT"

      - name: keep what this push ran
        id: stage
        if: ${{ !cancelled() && steps.save.outputs.pushed-key != '' }}
        shell: bash
        env:
          PUSHED: ${{ steps.save.outputs.pushed-path }}
        run: node packages/cli/dist/bin.js carry keep "$PUSHED"

      - if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.save.outputs.pushed-path }}
          key: ${{ steps.save.outputs.pushed-key }}

      # Only a push to `main` hands its records on, to the `publish` job, which
      # writes the record; this job writes only the badge, through the review
      # step above. It hands on the records the suite jobs handed on, as they
      # handed them, for the publish to fold over the mainline's record itself.
      # A red suite on `main` still hands them on: the next change is reviewed
      # against what `main` ran, not against an older record that no longer
      # describes it.
      - name: hand the records to publish
        id: hand
        if: ${{ !cancelled() && github.event_name == 'push' && steps.records.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: variance-records
          path: ${{ runner.temp }}/ran
          include-hidden-files: true
          retention-days: 1

  publish:
    # The record a push to `main` made, published to `refs/variance/mainline/main`
    # on this repository, which is where every pull request and every
    # selected run reads its base from. Its own job because it is the only
    # one that writes the record: the review in `record` writes only the badge.
    # The ref is outside `refs/heads` and `refs/tags`, so no branch rule and no
    # tag rule governs it, and nothing that lists branches shows it.
    #
    # `github.ref` is asked as well as the event, because `push` also fires for
    # a tag and for every other branch this workflow may one day be given, and
    # none of them may hold a token that writes the mainline's record.
    needs: record
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.record.outputs.handed == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Every commit, because the share asks git whether the record it holds
      # descends from this one before replacing it. The token that can write
      # is not left in the clone's configuration, where install scripts and
      # the build would run beside it; the publish step hands it to git itself.
      # The trees come with the commits for the same reason: a clone that
      # fetches a tree when it reads one needs a credential to fetch it with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      - uses: ./.github/actions/build

      - uses: actions/download-artifact@v8
        with:
          name: variance-records
          path: ${{ runner.temp }}/records

      # The test files the runner collects at this commit, asked of the runner:
      # a test file the suite stopped collecting is carried in the record from
      # before this commit, and only the runner can say it no longer counts
      # against a whole run. The publish retires its rows on the same answer.
      # Each shared suite is asked under its own slice's config, the one its
      # `test:<suite>` script runs: `unit` under `vitest.config.mts`, every other
      # under `vitest.<suite>.config.mts`, into `<suite>.txt`. A suite whose
      # files cannot be listed is left without a list and the others are still
      # listed: the publish below refuses that suite alone.
      - name: what the suite collects
        shell: bash
        env:
          SHARED: ${{ needs.record.outputs.shared }}
        run: |
          mkdir -p "$RUNNER_TEMP/collected"
          for suite in $SHARED; do
            if [ "$suite" = unit ]; then config=vitest.config.mts; else config="vitest.$suite.config.mts"; fi
            if [ ! -f "$config" ] || ! yarn vitest list --filesOnly --config "$config" > "$RUNNER_TEMP/collected/$suite.txt"; then
              rm -f "$RUNNER_TEMP/collected/$suite.txt"
              echo "::error::The files the $suite suite collects were not listed, so its record is not published."
            fi
          done

      # `share --publish`, handed the records the suite jobs handed on, folds
      # each suite's over the mainline's record, as `record` folded them, and
      # publishes every suite the root config gives to the share, on the line
      # of this run (`main`, on a push to it). It refuses a record that was not
      # recorded at this commit, or whose runs record does not show that every
      # test file the runner collects ran here. The runs record travels with
      # it, so a reader knows where each test last ran. What it did goes to the
      # job summary. A refusal of one suite does not keep the rest from being
      # published, and fails the step naming every suite refused: every pull
      # request measures from this record, so an older one left in place must
      # be seen.
      #
      # The token is this step's alone: `share` reads `GITHUB_TOKEN` when the
      # clone keeps no header, as `persist-credentials: false` leaves it.
      - name: publish the records
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node packages/cli/dist/bin.js share --publish "$RUNNER_TEMP/records" --collected "$RUNNER_TEMP/collected" | tee -a "$GITHUB_STEP_SUMMARY"

  shared:
    # The unit slice with each worker keeping its modules across files and the
    # isolator giving every test the values they loaded with: `yarn test:shared`,
    # the isolator README's Vitest config run over this repository. It reports
    # separately from the required `check`: a red result is a finding about the
    # isolator or a file that leaves state in the process, read against the same
    # file under `suite`. It starts once `rules` is green: a lint or a
    # documentation failure is two minutes to find, so it does not spend a
    # runner on a change that is already red, and it is not in `needs` of
    # `check`, so the wait adds nothing to the gate's time. It runs on `main`
    # and on a dispatch, not on a pull request: its finding is about the whole slice in one
    # process, which no change's selection holds, and nothing gates on it, so a
    # pull request paid a runner to learn what its unit `suite` legs had
    # already said.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: rules
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Node 24, for the reason written at the same step in `rules`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      - uses: ./.github/actions/build

      # The unit slice holds `docs_grep`'s tests, as at the same step in `suite`.
      - uses: ./.github/actions/ripgrep

      - name: run the unit slice on shared modules
        shell: bash
        run: yarn test:shared

  # How many shards each slice's near wave is worth in this group, counted by
  # `variance shards` from the times the mainline record holds and what the
  # group's change selects within two imports. A fixed split paid for every
  # shard of a slice the group barely touched, and split no further a slice a
  # hub change selected whole. A slice that selects nothing gets no job. The
  # count is the fewest shards whose last one finishes within `BUDGET`, setup
  # included, because what a group costs is the wait of every pull request
  # behind it. `SETUP` is what one `queue` job spent before its first test. A
  # slice with no record keeps the count `suite` gives it.
  plan:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/variance-authority/ci:33602dc5866e9770c88223131f3057d61611d121
      options: --ipc=host
    outputs:
      legs: ${{ steps.count.outputs.legs }}
      native-key: ${{ steps.build.outputs.native-key }}
      toolchain: ${{ steps.build.outputs.toolchain }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: trust the workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      - uses: ./.github/actions/build
        id: build

      # Every shared slice's mainline record, read once and handed to every
      # `queue` job, as `base` hands its read to `suite`: the line can move
      # while the legs start, and two shards of one slice that read two
      # records cut two different selections, so a file can fall between them.
      # A miss is handed as the read, for the reasons written at `read the
      # mainline once` in `base`, and each shard selects from what `take the
      # base` lays.
      - name: keep the base records
        id: read
        shell: bash
        run: |
          node packages/cli/dist/bin.js carry hand "$RUNNER_TEMP/base"
          node packages/cli/dist/bin.js share
          echo "dir=$RUNNER_TEMP/base" >> "$GITHUB_OUTPUT"

      - name: hand the read on
        id: hand
        uses: actions/upload-artifact@v7
        with:
          name: variance-base
          path: ${{ steps.read.outputs.dir }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # Each slice's files listed under its own config, so a test file the
      # group adds is counted. Workers are the slice's from `vitest.config.mts`,
      # and for `unit`, which sets none, Vitest's own: one fewer than the cores.
      # `--since` is only the fallback: the record's own commit wins.
      - id: count
        name: count the shards
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          SETUP: '100'
          BUDGET: '240'
        run: node tools/plan-suites.mjs

      - name: hand the native scanner on
        uses: actions/upload-artifact@v7
        with:
          name: variance-native
          path: |
            packages/sense/npm/*/scan.node
            packages/sense/npm/*/scan.node.tree
          if-no-files-found: error
          retention-days: 30

  queue:
    # A merge group's gate, and the only harness a group runs: lint and the
    # repository's rules in one job, and the tests within two imports of what
    # the group changes, the wave `verify:near` runs on a laptop, in the others.
    # The whole gate took thirteen minutes a group, three and a half of them
    # `base` building before any test started, and it answered again what each
    # pull request in the group had already answered on its own base.
    #
    # No `base`: `plan` reads the mainline once and hands its read to every
    # job, which selects from it. The group's commit is `main` with the pull
    # requests laid on it, so the selection is what they changed together
    # since the record was published. A slice whose record is not read runs
    # whole and says why. In the CI image, for the reason written at
    # `suite`: the near wave includes chromium files.
    #
    # Sharded as `plan` counts: the near wave of the three slices in one job took
    # twelve and a half minutes when the mainline record was a week old and it
    # selected every file. The selection drops what it skips before Vitest cuts
    # the shard, so the shards split what runs, by the record `plan` counted
    # from. A group records nothing, so no shard's record is folded.
    #
    # Not `fail-fast`, for the reason written at `suite`.
    needs: plan
    if: github.event_name == 'merge_group'
    name: queue (${{ matrix.part }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/variance-authority/ci:33602dc5866e9770c88223131f3057d61611d121
      options: --ipc=host

    steps:
      # Every commit, for the reason written at the checkout in `suite`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      # Node 24, for the reason written at the same step in `rules`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # For the reason written at the same step in `suite`.
      - name: trust the workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      - uses: ./.github/actions/build
        with:
          native-key: ${{ needs.plan.outputs.native-key }}
          toolchain: ${{ needs.plan.outputs.toolchain }}

      # The unit part only, for the reason written at the same step in `suite`.
      - uses: ./.github/actions/ripgrep
        if: matrix.part == 'unit'

      # The chromium part only, for the reason written at the same step in `suite`.
      - uses: ./.github/actions/case-subjects
        if: matrix.part == 'chromium'

      - name: lint
        if: matrix.part == 'rules'
        shell: bash
        run: yarn lint

      - name: check
        if: matrix.part == 'rules'
        shell: bash
        run: yarn check

      - name: restrictions
        if: matrix.part == 'rules'
        shell: bash
        run: yarn restrictions

      # The mainline's records as `plan` read them and counted from, for the
      # reasons written at the same steps in `suite`.
      - uses: actions/download-artifact@v8
        if: matrix.part != 'rules'
        with:
          name: variance-base
          path: ${{ runner.temp }}/base

      - name: take the base
        if: matrix.part != 'rules'
        shell: bash
        run: node packages/cli/dist/bin.js carry receive "$RUNNER_TEMP/base"

      - name: near tests
        if: matrix.part != 'rules'
        shell: bash
        env:
          SUITE: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}
        run: |
          yarn variance index
          VARIANCE_AUTHORITY_SINCE='' VARIANCE_AUTHORITY_AT_DISTANCE=0-2 yarn "test:$SUITE" --shard "$SHARD"

  # A `feat`, `fix` or `perf` pull request carries an idea that passed review
  # before its code was written: its body's first line says `Closes #<n>` or `Part of #<n>`, and the
  # issue carries `idea: build`, put on when the `occam` reviewer's idea review
  # let it through, with no edit to its body after (refine, "The idea loop").
  # It runs on the pull request and again in the merge queue, where it asks
  # every pull request the group merges, so an issue edited after a pull
  # request's last run still stops the merge. `tools/idea.mjs` holds the rule.
  idea:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/idea.mjs
          sparse-checkout-cone-mode: false
      - name: read each issue's verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_ref }}
        run: node tools/idea.mjs

  # The one check a branch rule names, and the one line that combines the
  # harnesses its event runs: `plan`, `queue` and `idea` for a merge group, and `rules`, `measure`,
  # `base`, `suite` and `record` for everything else, with `idea` on a pull request. `needs` alone would skip this job when one of them failed,
  # and a skipped job counts as passing to a branch rule — so it runs
  # `always()` and turns every harness's result into its own colour. Anything
  # but `success` is red, `cancelled` and `skipped` included: a harness that did
  # not finish said nothing about the change. The jobs the event does not run
  # are skipped on purpose and are not read.
  check:
    needs: [rules, measure, base, suite, record, plan, queue, idea]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: combine the harnesses
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            merge_group) gate='["plan","queue","idea"]' ;;
            pull_request) gate='["rules","measure","base","suite","record","idea"]' ;;
            *) gate='["rules","measure","base","suite","record"]' ;;
          esac
          missing=$(echo "$RESULTS" | jq -r --argjson gate "$gate" '$gate - keys | join(", ")')
          if [ -n "$missing" ]; then
            echo "::error::check reads $missing, which it does not need"
            exit 1
          fi
          read=$(echo "$RESULTS" | jq -c --argjson gate "$gate" 'with_entries(select(.key as $k | $gate | index($k)))')
          failed=$(echo "$read" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          echo "$read" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ -n "$failed" ]; then
            echo "::error::not every harness passed — $(echo "$failed" | paste -sd, -)"
            exit 1
          fi

      - name: get timing reporter
        continue-on-error: true
        if: ${{ !cancelled() }}
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/ci-timing.mjs
            tools/report-ci-timing.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: report gate timings
        timeout-minutes: 1
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/report-ci-timing.mjs
