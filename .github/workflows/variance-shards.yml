name: variance shards

# The sharded recipe: split a suite across CI jobs, and answer about the suite.
#
# An example workflow, meant to be copied and edited rather than read as the only
# way to wire this up. Everything in it that is a decision is commented as one.
#
# ## How the suite is split
#
# Each shard runs `variance run --shard k/n`. The unit is a file, never a subject:
# every story one CSF file declares, and every width of one route, go to the same
# shard, because they load the same module graph and splitting them pays for it
# twice. Files are placed by the time each subject took on the newest mainline
# commit this checkout descends from — longest first, onto the least loaded
# shard — and by a checksum of the file when no such record exists. Both are
# functions of the plan and the shard count, so every shard computes the same
# placement without talking to the others.
#
# Every subject another shard owns is recorded as `excluded`, naming the shard and
# what placed it there. `variance report` over all the shard files resolves those
# against what was observed, and a subject every shard left to another is
# promoted to `failed` — two shards that read different cost records disagree,
# and this is where it shows. That is the reason the merge job exists and the
# reason no shard job may be the gate. What is *not* caught is a shard that never
# ran at all — see the guard in the merge job.
#
# ## What the merge job publishes
#
# The suite index and the subject costs, once, for the whole build. No shard
# publishes either: a shard composed part of the suite, and an index counted
# from it would be believed as the whole. Each shard writes its part of the index
# beside its report instead — `report.suite-part.json`, in the artifact it
# already uploads — and `share --publish` over every shard's report composes the
# index one unsharded run would have written, and the costs of the merged report.
# A build that does not shard, like `variance.yml`, publishes from its own run.
#
# Both sit under `<cache>/suite`, keyed by commit, and the merge job saves the
# directory. The next build's shards restore it and walk their lineage to it,
# which is why they check out with full history: a shallow clone has no merge
# base to walk from, and places by checksum.

# ## This is the gate here
#
# It runs on every pull request and every push to `main`, over the twelve
# subjects of `cases/storybook-case` in five story files, and it is the check
# whose colour a change is held to. `variance.yml` observes the same subjects
# with the same comment marker, so it runs on demand only: on the same event the
# two would fight over one comment, each rewriting the other. A repository picks
# one gate.
#
# Two shards, not more: five files is not a suite that needs sharding, and a
# third shard would buy an install and a Storybook build to save nothing. What
# the fixture proves is the wiring — placement, the merge, the composed index —
# on every change, rather than on the day somebody dispatches it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: variance-shards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shard list, in one place, emitted as data.
  #
  # It could be written inline as a `matrix:` literal, and then the merge job
  # would have to be told how many shards to expect a second time. Two hardcoded
  # counts that must agree, with nothing checking that they do, is how a shard
  # gets deleted from the matrix and quietly stops being waited for.
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.list.outputs.shards }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - id: list
        shell: bash
        run: |
          set -euo pipefail

          # One entry per shard; the count is the `n` of `--shard k/n`, and the
          # merge job reads it from here rather than being told a second time.
          shards='[
            {"name": "1-of-2", "shard": "1/2"},
            {"name": "2-of-2", "shard": "2/2"}
          ]'

          {
            echo "shards=$(echo "$shards" | jq -c .)"
            echo "count=$(echo "$shards" | jq 'length')"
          } >> "$GITHUB_OUTPUT"

  shard:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      # No `pull-requests: write` here, and that is the point of splitting the
      # permissions per job rather than declaring them once at the top. A shard
      # has nothing to say to the pull request — the docket is the merge's to
      # post — so a shard job that tried would be doing something this workflow
      # does not intend, with a token that cannot.
      contents: read

    strategy:
      # Every shard runs, whatever the others did. The default would cancel the
      # rest as soon as one failed, and a shard fails when it finds a change —
      # which is a normal outcome here. Cancelling on it would produce a merged
      # report missing the shards that were still running, i.e. the exact hole
      # the merge job is built to refuse.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}

    # Every shard in the same image, and this one is not optional the way the
    # sweep's pin is. Shards whose renderer identity differs were not one run, and
    # the merge refuses them naming both files (ADR-0011). A matrix that varied
    # the image would produce reports that cannot be added up.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host

    steps:
      # Full history, so the lineage walk has a merge base with `origin/main` to
      # find subject costs at. A shallow clone places by checksum instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - shell: bash
        run: corepack enable && yarn install --immutable

      - shell: bash
        run: yarn build

      # The suite index and subject costs mainline recorded. Every shard restores
      # the same entry and reads the same costs, so every shard places the same.
      - name: restore the mainline evaluation
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/variance-authority/suite
          key: variance-suite-${{ github.sha }}
          restore-keys: |
            variance-suite-

      # The subject has to exist before a shard can slice it. Every shard builds
      # its own copy: `storybook-static/` is ignored and a build artifact passed
      # between jobs would be one more thing that can be stale in one shard and
      # not another.
      - name: build the Storybook this shard slices
        shell: bash
        run: yarn workspace @variance-authority/case-storybook build-storybook

      # The same store every other workflow here reads, painted by `variance.yml`
      # on each push to `main`. Restored per shard because a shard is a whole run
      # of a slice: it compares, and it has nothing to compare against otherwise.
      #
      # The key names the image because the image is the renderer, and it has to
      # name the same one as `container.image` above. Nothing checks that it does;
      # a mismatch is reported `incomparable` rather than diffed (ADR-0011).
      - name: restore the baselines main last painted
        uses: actions/cache/restore@v4
        with:
          path: cases/storybook-case/.variance/baselines
          key: variance-baselines-playwright-v1.62.1-noble-${{ github.sha }}
          restore-keys: |
            variance-baselines-playwright-v1.62.1-noble-

      - id: variance
        uses: ./.github/actions/variance
        with:
          config: cases/storybook-case/variance.config.json
          profile: chromium
          command: node packages/cli/dist/bin.js
          # No `--run` or `--commit`: every shard names itself from
          # `GITHUB_RUN_ID` and `GITHUB_SHA`, which are the same across the
          # matrix, so the merge carries one run and costs publish under it.
          shard: ${{ matrix.shard.shard }}

          # Identical across shards, and it has to be: the merge refuses shards
          # whose `--intent` differs, because a run's intent is what lets the
          # verdict say *this is the change you said you were making*, and shards
          # claiming different intents were different runs.
          intent: ${{ github.event.pull_request.title || format('sharded run of {0}', github.sha) }}

          # OFF, once per shard, and the reason is not the same as the gate's.
          # There, one comment per run is what the marker keeps in place. Here,
          # shards commenting would produce one docket each, every one describing
          # part of the suite, and the marker would make them fight over one
          # comment — each rewriting the last with a narrower answer.
          comment: 'false'

          # OFF, and it must stay off in a sharded workflow specifically. `accept
          # --all` in a shard promotes what *that shard* observed, so concurrent
          # jobs would race to push partial baseline commits to one branch.
          # Approval belongs to a person, after the merged docket.
          commit-baselines: 'false'

      # The report, kept whole. `--format html` is not rendered per shard: image
      # paths in it are relative to the report, and a page describing part of
      # the suite would look like a complete run with most of it missing.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variance-shard-${{ matrix.shard.name }}
          path: cases/storybook-case/.variance/
          # Without this every shard uploads nothing and the merge below refuses
          # for the right reason with the wrong cause: `.variance` is a dotted
          # directory and this action skips hidden files by default.
          include-hidden-files: true
          # `error`, not `warn`. An absent report from a shard is the one hole the
          # merge cannot reason about: a subject nobody observed is *missing* from
          # every file rather than excluded in all of them, so the merged suite
          # would simply be smaller and still green. Fail here, where the shard's
          # own log says why.
          if-no-files-found: error

  merge:
    needs: [prepare, shard]

    # `always()`, and this is the load-bearing line of the file. A shard that
    # found a change exits 1 and fails its own job; the default `needs` behaviour
    # would then skip this job, and the suite's answer — the one that resolves the
    # excludes and catches the subject nobody looked at — would never be computed
    # for exactly the pull requests that needed it.
    if: ${{ always() }}

    runs-on: ubuntu-24.04

    # The shards' image, and not for a browser: `report`, `share` and `comment`
    # open none. It is for the cache entry this job saves. `actions/cache` stores
    # a path relative to the workspace, and the workspace and `~` sit in
    # different places inside a container than outside one — so an entry saved
    # from a bare runner unpacks, in the next build's shards, somewhere their run
    # never reads, and they place by checksum with nothing red to say so. One
    # layout for every job that touches the entry keeps it where it was saved.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - shell: bash
        run: corepack enable && yarn install --immutable

      - shell: bash
        run: yarn build

      - uses: actions/download-artifact@v4
        with:
          pattern: variance-shard-*
          path: shards
          # NOT `merge-multiple`. Every shard writes its report to the same path
          # from its config, so flattening them into one directory would have each
          # overwrite the last and leave one file where there should be one per
          # shard — and `variance report` over one file is a valid, quiet, wrong answer
          # about the suite.
          merge-multiple: false

      - id: collect
        name: every shard reported, or none of this is about the suite
        shell: bash
        env:
          EXPECTED: ${{ needs.prepare.outputs.count }}
        run: |
          set -euo pipefail

          # The report's filename comes from the config, through the same locator
          # the action uses, rather than being guessed or re-declared here. A
          # config that moved `report` would otherwise make this find nothing and
          # report it as a missing shard.
          report_path="$(node .github/actions/variance/locate-artifacts.mjs cases/storybook-case/variance.config.json \
            | sed -n 's/^report=//p')"
          name="$(basename "$report_path")"

          # A read loop rather than `mapfile` or `xargs -d`: both are fine on this
          # runner and neither is portable, and the point of an example workflow
          # is that it survives being pasted somewhere else. `IFS=` and `-r` are
          # what keep a path with a space in it one path.
          found=()
          while IFS= read -r line; do
            [ -n "$line" ] && found+=("$line")
          done < <(find shards -type f -name "$name" | sort)

          echo "found ${#found[@]} of $EXPECTED shard report(s):"
          printf '  %s\n' "${found[@]:-}"

          # The guard the merge cannot do for itself. `variance report` resolves
          # excludes against observations *in the files it was given*, so a shard
          # whose job died — exit 2, a killed browser, a cancelled run — takes its
          # slice out of the arithmetic entirely: those subjects are absent rather
          # than excluded-everywhere, and the merged suite comes back smaller and
          # green. Refusing here is how "a shard did not run" stops looking like
          # "the suite is smaller than you thought".
          if [ "${#found[@]}" -ne "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED shard reports and found ${#found[@]}; a shard that did not run removes its subjects from the merge instead of failing them, so this refuses rather than reporting about a suite it did not see."
            exit 2
          fi

          # Newline-separated into one output, read back into an array by the
          # steps below, so a path with a space cannot split into two arguments.
          {
            echo 'reports<<EOF'
            printf '%s\n' "${found[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - id: report
        name: variance report — the suite, not a slice
        shell: bash
        env:
          REPORTS: ${{ steps.collect.outputs.reports }}
        run: |
          set -uo pipefail

          reports=()
          while IFS= read -r line; do
            [ -n "$line" ] && reports+=("$line")
          done <<< "$REPORTS"

          # This exit code is the check's colour. Not any shard's: each shard
          # answered about its own slice and exited 0 for doing so correctly, and
          # the promotion of an everywhere-excluded subject to `failed` happens
          # here or nowhere.
          if node packages/cli/dist/bin.js report \
               --config cases/storybook-case/variance.config.json "${reports[@]}"; then
            code=0
          else
            code=$?
          fi

          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          echo "variance report exited $code"

      # Restored first so the entry saved below carries what mainline already
      # had beside this commit: the next build restores whichever entry is
      # newest, and walks its lineage through what that entry holds.
      - name: restore the mainline evaluation
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/variance-authority/suite
          key: variance-suite-${{ github.sha }}
          restore-keys: |
            variance-suite-

      # The suite index composed from every shard's part, and what each subject
      # cost, under this commit. Saved on a push so the next build reads one evaluation and
      # its shards balance on it. Skipped when the merge refused: the shards were
      # not one run, and their parts are not one suite's.
      - if: ${{ steps.report.outputs.exit-code != '2' }}
        name: publish the suite index and the subject costs
        shell: bash
        env:
          REPORTS: ${{ steps.collect.outputs.reports }}
        run: |
          set -euo pipefail

          reports=()
          while IFS= read -r line; do
            [ -n "$line" ] && reports+=("$line")
          done <<< "$REPORTS"

          node packages/cli/dist/bin.js share --publish \
            --config cases/storybook-case/variance.config.json "${reports[@]}"

      # Mainline's only: a pull request's costs are timed on a change nobody has
      # merged, and every build after it would balance on them. This is the one
      # writer of the entry now that the unsharded workflow runs on demand, so
      # the key is the commit and nothing else.
      - if: ${{ github.event_name == 'push' && steps.report.outputs.exit-code != '2' }}
        name: keep the mainline evaluation
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/variance-authority/suite
          key: variance-suite-${{ github.sha }}

      - if: ${{ github.event_name == 'pull_request' && steps.report.outputs.exit-code != '2' }}
        id: render
        name: render one docket
        shell: bash
        env:
          REPORTS: ${{ steps.collect.outputs.reports }}
        run: |
          set -euo pipefail

          marker=$(node packages/cli/dist/bin.js comment --config cases/storybook-case/variance.config.json --marker)
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

          reports=()
          while IFS= read -r line; do
            [ -n "$line" ] && reports+=("$line")
          done <<< "$REPORTS"

          # Naming reports replaces the configured one rather than adding to it,
          # so this body is about the shards and nothing else. The body is
          # written even when empty: the poster distinguishes "nothing needs
          # review" — which may clear a previous docket — from "the render never
          # happened", which may not.
          node packages/cli/dist/bin.js comment \
            --config cases/storybook-case/variance.config.json \
            --body-file "$RUNNER_TEMP/variance-comment.md" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${reports[@]}"

      - if: ${{ github.event_name == 'pull_request' && steps.report.outputs.exit-code != '2' }}
        name: post the docket
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANCE_MARKER: ${{ steps.render.outputs.marker }}
        run: |
          node .github/actions/variance/post-comment.mjs \
            --body-file "$RUNNER_TEMP/variance-comment.md" \
            --marker "$VARIANCE_MARKER"

      - if: always()
        name: verdict
        shell: bash
        env:
          CODE: ${{ steps.report.outputs.exit-code }}
        run: |
          case "${CODE:-}" in
            0)
              echo "nothing needs review, across every shard."
              ;;
            1)
              echo "::error::variance found changes that need review; the docket is in the pull request comment. A subject listed as failed with no diff is one that every shard left to another — the shards placed the suite differently, which is not a change in the product."
              exit 1
              ;;
            2)
              echo "::error::the shards could not be merged into one answer. No verdict was reached about the suite. See the collect step."
              exit 2
              ;;
            '')
              echo "::error::the report step produced no exit code, so this workflow cannot say what happened."
              exit 2
              ;;
            *)
              echo "::error::variance exited $CODE, which is not one of its three codes; treating it as a failure."
              exit "$CODE"
              ;;
          esac
