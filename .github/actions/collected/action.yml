name: collected
description: >-
  The test files the runner collects at this commit, one `<suite>.txt` per
  shared suite under `$RUNNER_TEMP/collected`, for `share --publish
  --collected`.

# A test file the suite stopped collecting is carried in the record from
# before this commit, and only the runner can say it no longer counts against
# a whole run; the publish retires its rows on the same answer. Each shared
# suite is asked under its own slice's config, the one its `test:<suite>`
# script runs: `unit` under `vitest.config.mts`, every other under
# `vitest.<suite>.config.mts`. A suite whose files cannot be listed is left
# without a list and the others are still listed: the publish refuses that
# suite alone. Both jobs that publish take this step, so they ask the runner
# the same question.

inputs:
  suites:
    description: The shared suites, separated by spaces, as `carry` names them in `shared-suites`.
    required: true

runs:
  using: composite
  steps:
    - name: what the suite collects
      shell: bash
      env:
        SHARED: ${{ inputs.suites }}
      run: |
        mkdir -p "$RUNNER_TEMP/collected"
        for suite in $SHARED; do
          if [ "$suite" = unit ]; then config=vitest.config.mts; else config="vitest.$suite.config.mts"; fi
          if [ ! -f "$config" ] || ! yarn vitest list --filesOnly --config "$config" > "$RUNNER_TEMP/collected/$suite.txt"; then
            rm -f "$RUNNER_TEMP/collected/$suite.txt"
            echo "::error::The files the $suite suite collects were not listed, so its record is not published."
          fi
        done
