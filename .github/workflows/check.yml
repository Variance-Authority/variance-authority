name: check

# This repository's own gate. Everything in it that is a decision is commented as
# one.
#
# `.github/workflows/variance.yml` is a different thing entirely: an *example* of
# wiring the tool into somebody's project, which happens to live here. Until this
# file existed, nothing ran `yarn build`, `yarn check` or `yarn test` anywhere but
# a laptop — so `tools/boundaries.check.ts` and the `tools/docs-*.check.ts` rules
# were enforcing themselves only against whoever happened to type the command.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # 24, and only 24, which is what `docker/linux-verify.sh` runs on.
      #
      # This was a `['22', '24']` matrix, added because a pin at 22 had hidden a
      # bug the image found: a remote call built its `AbortSignal` from whatever
      # realm a jsdom test environment had installed, which the newer runtime
      # brand-checks and refuses. The lesson there was that CI must run the
      # runtime something actually runs on, and the matrix was one answer to it.
      #
      # The 22 leg was never the answer it looked like. `setup-node` resolves
      # `'22'` to the newest 22 there is, so the leg tested a runtime that moves
      # under it and never once tested the floor the packages declare. It was a
      # second modern Node, bought at twice the runner time.
      #
      # So the floor is now a claim and not a check: `sense` and its dependents
      # say `>=22.15` because that is where `zlib.zstdCompressSync` arrived, and
      # nothing here proves a 22.15 install works. Stating that is the point of
      # this comment. What is tested is 24, and 24 is what the image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install
        shell: bash
        run: corepack enable && yarn install --immutable

      # Build first, and not only to catch type errors: the documentation check
      # compiles each README example against each package's built `.d.ts`,
      # because that is the file a consumer's editor resolves (ADR-0014). A
      # checker reading `src` would pass on things the published types refuse.
      - name: build
        shell: bash
        run: yarn build

      # Between build and test because it is the fastest of the three and its
      # failures are the cheapest to act on: an unused import is a one-line fix,
      # and finding it after a 35-second suite wastes the difference.
      - name: lint
        shell: bash
        run: yarn lint

      # Before the tests, because a repository in an illegal state — a dangling
      # link, an undeclared import, a file past the size limit — is cheaper to
      # learn about in half a second than after a 35-second suite. These are
      # checks and not tests: they exercise no behaviour and have no subject,
      # they read the repository as data. `yarn test` used to run them too, and
      # over half of what it reported as passing tests was this.
      - name: check
        shell: bash
        run: yarn check

      # The cost arguments, timed. Separate from the suite because the suite
      # instruments every product module it loads, and a bound on how long the
      # product takes cannot be read through the thing reading it — see
      # `vitest.measure.config.ts`. Before the suite because it is seconds, and
      # because a machine that has just run three hundred files is not the one
      # these numbers describe.
      - name: measure
        shell: bash
        run: yarn measure

      # `vitest run` is the unit suites and the corpus. The package boundary
      # rules (ADR-0013) and the documentation rules (ADR-0014) ran here until
      # 2026-08-04 and now run in the step above.
      - name: test
        shell: bash
        run: yarn test

      # ## What this job does not do, stated rather than discovered
      #
      # **No browser.** Nothing here runs `npx playwright install`, so the suites
      # across 39 files that need a Chromium announce themselves as skipped, each
      # carrying the command that would fix it. That sentence is not taken on
      # trust: `tools/skips.check.ts` asserts every gated file announces, and pins
      # the count in this comment to the number of gated files it finds.
      #
      # That is a decision and not a cost saving. Every rect, ratio and pixel
      # count this project asserts came from one Mac and one Chromium, so running
      # those suites on a Linux runner would check a measurement against a
      # machine that did not make it. Whether the numbers survive that move is
      # `docker/linux-verify.sh`'s question, it is open, and a red check here
      # would be the wrong way to ask it.
      #
      # The consequence is that a green check on this workflow is not a green
      # suite, and the skip list in the step above is what keeps the two from
      # being confused.
      - name: say what was skipped
        if: always()
        shell: bash
        run: |
          echo "::notice::Browser suites did not run: no Chromium is installed. Every measurement in this repository comes from one Mac and one Chromium, and re-measuring on Linux is docker/linux-verify.sh, which has never been executed."
