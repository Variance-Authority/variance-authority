name: variance
description: >-
  Run variance-authority over a change, put the docket on the pull request, and
  fail the check from the CLI's exit code.

# A composite action, not a JavaScript one, and not a container one.
#
# A JavaScript action would be a second implementation of everything the CLI
# already does — argument handling, config reading, verdicts — bundled into a
# committed `dist/` that nobody reviews and that drifts from the CLI it claims to
# wrap. A container action would pin an image here, where the operator cannot see
# it, for a tool whose entire premise is that the renderer's identity is part of
# the measurement (ADR-0011): the image a baseline was painted in belongs in the
# operator's workflow, next to the baselines, not hidden inside an action.
#
# So this is bash around `variance run`. Every decision it makes is a decision the
# CLI already made, and the things it adds — a comment, an optional commit, an
# optional upload and the cache moves — are the ones a command line cannot do for
# itself.
#
# ## Every path and key comes from `variance carry`
#
# The config says where each artifact lives and who carries it. `variance carry`
# reads it with the CLI's own parser and prints the paths and the cache keys, so
# nothing below names a path or builds a key. A config whose baselines declare
# `carry: actions-cache` gets them restored before the run and saved after an
# accept; any other config gets no key, and those steps do not run.
#
# ## The check's colour comes from the exit code, and from nothing else
#
# `exit.ts` reserves `0` for "nothing needs review", `1` for "the run happened and
# found something a person must look at", and `2` for "the run did not happen as
# configured". Those three integers are the contract. Nothing in this file greps
# the CLI's output, because a check whose colour depends on a sentence is a check
# that silently changes meaning the day somebody improves the wording — and the
# improvement would look like a documentation change in review.
#
# `2` additionally suppresses the comment and the commit-back. A run that never
# launched a renderer has no report worth quoting and no baselines worth
# promoting; posting the previous run's report as though it were this one's is the
# stale-finding failure, and accepting baselines from it would overwrite the only
# copy of what a subject used to look like.

inputs:
  config:
    description: >-
      Path to the variance config, relative to `working-directory`. Every path and
      cache key the action needs afterwards is read from this file by `variance
      carry` rather than repeated as an input, so the two can never disagree.
    required: false
    default: variance.config.json

  profile:
    description: >-
      `jsdom` or `chromium`. Empty leaves the config's own profile in force; this
      is an override for a workflow that runs the same config at two tiers, not a
      default.
    required: false
    default: ''

  subjects:
    description: 'Glob over subject ids. Non-matching subjects are reported as excluded, never dropped.'
    required: false
    default: ''

  shard:
    description: >-
      `k/n`: observe the files placed on shard k of n, by the costs the mainline
      lineage recorded or by file count when there are none. Every other subject is
      reported as another shard's, never dropped, and `variance report` over all n
      reports is the suite.
    required: false
    default: ''

  intent:
    description: 'What this run is comparing, in the operator’s words. Carried into the comment.'
    required: false
    default: ''

  command:
    description: >-
      How to invoke the CLI. Split on whitespace, so `node packages/cli/dist/bin.js`
      works as well as a bin on PATH. `--no-install` is deliberate: nothing about a
      run may be downloaded while it is happening, or the render inputs stop being
      the ones in the repository.
    required: false
    default: npx --no-install variance

  working-directory:
    description: 'Directory to run in. Also where `@variance-authority/cli` is resolved from.'
    required: false
    default: '.'

  comment:
    description: >-
      Post the docket to the pull request: one comment for the config's
      `project`, updated in place.
    required: false
    default: 'true'

  adopt-unkeyed-comment:
    description: >-
      Take over the docket this job posted before the marker named the config's
      `project`, rather than post a second comment beside it on a pull request
      opened before the upgrade. Set it to `'false'` on a job that never posted
      a comment before then: in a repository with two gates, the old docket is
      the other gate's, and taking it would replace that docket, or clear it on
      a clean run.
    required: false
    default: 'true'

  accept:
    description: >-
      Promote what this run renders before the gate compares, and save the store
      for every run after. The gate still compares against what was promoted,
      and a subject that renders differently twice still turns the check red,
      but the accept is kept either way: one unstable subject does not take the
      others' baselines with it. For a store the
      host cache carries (`carry: actions-cache`); a committed store accepts
      through `commit-baselines` instead. Turn it on only for a run a person
      asked for, such as one a label started: on every run,
      `accept --all` promotes the regression the check was added to catch. Off
      by default.
    required: false
    default: 'false'

  commit-baselines:
    description: >-
      Accept every changed subject and push the regenerated baselines to the pull
      request's head branch, as a bot. This is how a committed store accepts a
      change: the images arrive in the pull request's diff, and its review is
      the approval. Turn it on only for a run a person asked for, such as one
      started by a label. On every run, `accept --all` promotes the
      regression the check was added to catch, in the run that found it. Needs
      `contents: write` and a checkout of the head branch. Off by default.
    required: false
    default: 'false'

  commit-message:
    required: false
    default: 'chore(variance): regenerate baselines'

  github-token:
    description: >-
      Token used to read and write the pull-request comment. Nothing is sent
      anywhere else. A `pull_request` run from a fork receives a read-only token,
      and the comment step warns rather than failing in that case.
    required: false
    default: ''

  run-url:
    description: >-
      Link printed in the comment for the full report. Empty by default and
      deliberately not inferred: a link is only honest if something was
      published to link to. `report-page` supplies its own and takes precedence.
    required: false
    default: ''

  report-page:
    description: >-
      Write the HTML report as one file with its images inside it, upload it
      unzipped as the `variance-report-<project>.html` artifact, and link that
      from the comment. Named for the config's `project`, so two jobs over two
      configs in one run each upload their own: a run holds one artifact per
      name. `<project>` is spelled as `variance carry` prints it, with every
      character but a letter, a digit, `_` or `-` written as `%XX`. The artifact
      opens in the browser, a phone's included. Off by default, because it is
      the one thing this action would publish: the images are pixels of your
      product, kept for your artifact retention period.
    required: false
    default: 'false'

  image-ref:
    description: >-
      Removed: set `image-ref-prefix` instead. A ref named by the workflow
      cannot hold the project this action reads from the config, so two jobs
      would push to one ref. Set, it fails the run rather than leaving the
      comment without pictures behind a warning.
    required: false
    default: ''

  image-ref-prefix:
    description: >-
      A prefix to push the report's before and after images under, so the
      comment can show the leading cause's pair on its first screen, such as
      `refs/variance/project`, with no trailing slash. The action pushes them to
      `<prefix>/<project>/images/<head branch>`, with `<project>` as
      `variance carry --format github` prints it, one segment a ref takes, and
      the head branch the pull request's. Named for the project as well as the
      branch, because each config's run pushes its own pictures and a second
      project's push would replace the first's while its comment still links
      them. Outside `refs/heads/`, a clone does not fetch it and the branch list
      does not show it. One commit with no parent, replaced by every run that
      finds a change, and linked by its commit so a reader never sees the
      previous run's pictures from a cache. Empty is off. Anyone who can read
      the repository can read the images, and pushing needs `contents: write`;
      deleting the refs when the pull request closes is the workflow's job,
      since this action runs on nothing but the change.
    required: false
    default: ''

  to-accept:
    description: >-
      How a reviewer accepts in this repository, printed at the foot of the
      comment as `To accept: <this>`. Markdown. Empty prints nothing: whether it
      is a workflow to dispatch, a label or a command is your policy, and this
      action does not guess it.
    required: false
    default: ''

  exit-zero-on-changes:
    description: >-
      `true` for a check that reports rather than blocks: changes that need
      review are named as a warning and the check passes, with the comment and
      the report as they would be otherwise. It still fails when the run did
      not happen, when a subject could not be observed or its observation
      errored, and when an accept the comparison after it did not hold.
    required: false
    default: 'false'

outputs:
  # The doctor step writes `exit-code` only when it refuses, so a run step it
  # skipped leaves the run's answer empty and the doctor's 2 is the one read.
  exit-code:
    description: '0 nothing needs review, 1 changes need review, 2 the run did not happen.'
    value: ${{ steps.run.outputs.exit-code || steps.doctor.outputs.exit-code }}
  report:
    description: 'Absolute path to the run report, resolved from the config.'
    value: ${{ steps.carry.outputs.report }}
  images:
    description: 'Absolute path to the directory the report names its images in.'
    value: ${{ steps.carry.outputs.images }}
  baselines:
    description: 'Absolute path to the baseline store, or empty when the checkout holds none: a remote store, or ephemeral retention.'
    value: ${{ steps.carry.outputs.baselines-root }}

runs:
  using: composite
  steps:
    - if: ${{ inputs.image-ref != '' }}
      name: refuse the removed image-ref input
      shell: bash
      run: |
        echo "::error::image-ref is removed: set image-ref-prefix, such as refs/variance/project, and the action names the ref for the project and the branch"
        exit 1

    # Before the run, because the baselines have to be in place before it
    # compares. A config the parser refuses stops here, with the CLI's message.
    - id: carry
      name: what the host carries
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        VARIANCE_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        $VARIANCE_COMMAND carry restore --config "$VARIANCE_CONFIG" --format github >> "$GITHUB_OUTPUT"

    # Saved keys end in the run, so no key is exact and the newest prefix match
    # wins: this commit's accept first, then the newest on the line, then the
    # newest on another mainline, for a line nobody accepted on. A pull
    # request searches its own cache scope before its base's, which is how an
    # accept made on it outranks what the base painted since.
    - if: ${{ steps.carry.outputs.baselines-key != '' }}
      name: restore the newest accepted baselines
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.carry.outputs.baselines-path }}
        key: ${{ steps.carry.outputs.baselines-key }}
        restore-keys: ${{ steps.carry.outputs.baselines-restore-keys }}

    # Before anything compares, because the run meets an LFS pointer only at a
    # subject whose document moved: one that did not is settled from its `.json`
    # sidecar without its image being read, so a checkout that skipped the LFS
    # fetch would pass green until somebody edits a component. `--baselines`
    # reads the store's first bytes and nothing else, no browser and no font, and
    # exits 2 on a pointer; this step then fails, every step that compares or
    # writes is skipped, and the verdict reports 2. Only for a store in the
    # checkout: a remote store and ephemeral retention keep nothing here.
    - id: doctor
      if: ${{ steps.carry.outputs.baselines-root != '' }}
      name: refuse a checkout of LFS pointers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        VARIANCE_CONFIG: ${{ inputs.config }}
      run: |
        set -uo pipefail
        # shellcheck disable=SC2086
        if $VARIANCE_COMMAND doctor --config "$VARIANCE_CONFIG" --baselines; then exit 0; else code=$?; fi
        # Any refusal here means the run did not happen, so the verdict reads 2
        # whatever doctor exited with; a crash must not read as "changes".
        echo "exit-code=2" >> "$GITHUB_OUTPUT"
        exit "$code"

    # `--exit-zero-on-changes` because this run is not asking: the person has
    # already decided. It suppresses 1 and never 2, so a run whose browser did
    # not launch still fails here rather than accepting an empty report. The
    # gate below then compares against what was promoted, which is how a subject
    # that does not render the same way twice is found.
    - id: promote
      if: ${{ inputs.accept == 'true' }}
      name: promote what this run proposes
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        VARIANCE_CONFIG: ${{ inputs.config }}
        VARIANCE_PROFILE: ${{ inputs.profile }}
        VARIANCE_SUBJECTS: ${{ inputs.subjects }}
        VARIANCE_INTENT: ${{ inputs.intent }}
      run: |
        set -euo pipefail

        args=(run --config "$VARIANCE_CONFIG" --exit-zero-on-changes)
        if [ -n "$VARIANCE_PROFILE" ]; then args+=(--profile "$VARIANCE_PROFILE"); fi
        if [ -n "$VARIANCE_SUBJECTS" ]; then args+=(--subjects "$VARIANCE_SUBJECTS"); fi
        if [ -n "$VARIANCE_INTENT" ]; then args+=(--intent "$VARIANCE_INTENT"); fi

        # shellcheck disable=SC2086
        $VARIANCE_COMMAND "${args[@]}"
        # shellcheck disable=SC2086
        $VARIANCE_COMMAND accept --config "$VARIANCE_CONFIG" --all

    - id: run
      name: variance run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        VARIANCE_CONFIG: ${{ inputs.config }}
        VARIANCE_PROFILE: ${{ inputs.profile }}
        VARIANCE_SUBJECTS: ${{ inputs.subjects }}
        VARIANCE_SHARD: ${{ inputs.shard }}
        VARIANCE_INTENT: ${{ inputs.intent }}
      run: |
        set -uo pipefail

        args=(run --config "$VARIANCE_CONFIG")
        if [ -n "$VARIANCE_PROFILE" ]; then args+=(--profile "$VARIANCE_PROFILE"); fi
        if [ -n "$VARIANCE_SUBJECTS" ]; then args+=(--subjects "$VARIANCE_SUBJECTS"); fi
        if [ -n "$VARIANCE_SHARD" ]; then args+=(--shard "$VARIANCE_SHARD"); fi
        if [ -n "$VARIANCE_INTENT" ]; then args+=(--intent "$VARIANCE_INTENT"); fi

        # `if` rather than `set +e`: the condition of an `if` is exempt from
        # errexit, so the code is captured without ever disarming the shell for
        # the lines that follow. Losing the exit code here would lose the only
        # thing this action reads.
        #
        # $VARIANCE_COMMAND is intentionally unquoted, so `node path/to/bin.js`
        # splits into a command and its argument.
        # shellcheck disable=SC2086
        if $VARIANCE_COMMAND "${args[@]}"; then code=0; else code=$?; fi

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "variance exited $code"

    # Beside the report rather than in `RUNNER_TEMP`: in a container job the
    # runner's temp path is the host's spelling, and the upload runs inside the
    # container. The report directory is resolved in here, so it is the right one.
    - id: page
      name: write the report page
      if: ${{ inputs.report-page == 'true' && steps.run.outputs.exit-code != '2' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        VARIANCE_CONFIG: ${{ inputs.config }}
        VARIANCE_REPORT: ${{ steps.carry.outputs.report }}
        VARIANCE_PROJECT: ${{ steps.carry.outputs.project }}
      run: |
        set -euo pipefail
        page="$(dirname "$VARIANCE_REPORT")/variance-report-$VARIANCE_PROJECT.html"
        # `--exit-zero-on-changes`: this step writes a page, and the verdict is
        # the run step's. It suppresses 1 and never 2.
        # shellcheck disable=SC2086
        $VARIANCE_COMMAND report --config "$VARIANCE_CONFIG" --format html --embed-images \
          --exit-zero-on-changes > "$page"
        echo "path=$page" >> "$GITHUB_OUTPUT"

    # `archive: false` uploads the one file as it is, named for the file, so the
    # link opens the page instead of downloading a zip.
    - id: upload
      name: upload the report page
      if: ${{ steps.page.outputs.path != '' }}
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.page.outputs.path }}
        archive: false
        if-no-files-found: error

    # Only on 1: a clean run renders an empty body with nowhere to put a
    # picture, and 2 has no report of this run to take them from.
    #
    # A repository of its own in a temporary directory, with the report's
    # directory as its work tree: nothing here reads or writes the workspace's
    # checkout, its index or its credentials, so this step cannot disturb the
    # commit-back below or the tree the run observed. The paths are the report's
    # own, so the branch holds what the comment links and nothing else.
    #
    # Every failure warns and leaves `root` empty, and the comment renders
    # without pictures. A fork's read-only token is the common one, and a
    # comment with no pictures is still the whole verdict.
    - id: images
      name: publish the images the comment shows
      if: ${{ inputs.image-ref-prefix != '' && inputs.comment == 'true' && steps.run.outputs.exit-code == '1' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VARIANCE_REPORT: ${{ steps.carry.outputs.report }}
        VARIANCE_IMAGE_REF_PREFIX: ${{ inputs.image-ref-prefix }}
        VARIANCE_PROJECT: ${{ steps.carry.outputs.project }}
        VARIANCE_BRANCH: ${{ github.head_ref }}
      run: |
        set -uo pipefail
        skip() { echo "::warning::the comment shows no images: $1"; exit 0; }

        [ -n "$VARIANCE_BRANCH" ] || skip "there is no pull request branch to name the images ref for"
        [ -n "$VARIANCE_PROJECT" ] || skip "carry named no project to name the images ref for"
        VARIANCE_IMAGE_REF="$VARIANCE_IMAGE_REF_PREFIX/$VARIANCE_PROJECT/images/$VARIANCE_BRANCH"
        [ -n "$GITHUB_TOKEN" ] || skip "no github-token to push $VARIANCE_IMAGE_REF with"

        here="$(dirname "$VARIANCE_REPORT")"
        repo="$(mktemp -d)"
        paths="$repo/paths"
        # What the comment shows of each subject: the change, cropped, where the
        # report has one, and otherwise the before and after, only where it holds
        # both, since a subject with one of them is never pictured. Never a path
        # that leaves the report's directory.
        node -e '
          const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
          const inside = (path) => typeof path === "string" && !path.split("/").includes("..");
          for (const { images } of report.observations ?? []) {
            const shown = inside(images?.change) ? [images.change] : [images?.before, images?.after];
            if (shown.every(inside)) console.log(shown.join("\n"));
          }
        ' "$VARIANCE_REPORT" > "$paths" || skip "the report could not be read"
        [ -s "$paths" ] || skip "the report names no image of a change"

        git init -q --bare "$repo/git"
        export GIT_DIR="$repo/git" GIT_WORK_TREE="$here"
        # Literal, because a store-encoded file name is not a pathspec.
        git --literal-pathspecs add -f --pathspec-from-file="$paths" || skip "the images could not be staged"
        tree="$(git write-tree)" || skip "the images could not be written"
        commit="$(git -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit-tree "$tree" -m "variance: images for $VARIANCE_IMAGE_REF")" || skip "the images could not be committed"

        auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$auth"
        git -c http.extraheader="AUTHORIZATION: basic $auth" \
          push -q --force "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$commit:$VARIANCE_IMAGE_REF" \
          || skip "pushing $VARIANCE_IMAGE_REF was refused, which a fork's read-only token does"

        echo "root=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$commit" >> "$GITHUB_OUTPUT"

    - id: render
      name: render the docket
      if: ${{ inputs.comment == 'true' && steps.run.outputs.exit-code != '2' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        VARIANCE_CONFIG: ${{ inputs.config }}
        VARIANCE_RUN_URL: ${{ steps.upload.outputs.artifact-url || inputs.run-url }}
        VARIANCE_TO_ACCEPT: ${{ inputs.to-accept }}
        VARIANCE_IMAGE_ROOT: ${{ steps.images.outputs.root }}
      run: |
        set -euo pipefail

        # The marker, asked for separately, because the poster needs it in the
        # one case where there is no body to read it out of: a clean run, where
        # a *previous* docket has to be found. It names the config's project, so
        # two configs on one pull request keep a comment each; this reads the
        # config and no report.
        #
        # $VARIANCE_COMMAND is unquoted so `node path/to/bin.js` splits.
        # shellcheck disable=SC2086
        marker=$($VARIANCE_COMMAND comment --config "$VARIANCE_CONFIG" --marker)
        echo "marker=$marker" >> "$GITHUB_OUTPUT"

        # The body, written even when it is empty — the poster distinguishes
        # "nothing needs review" from "the render never ran", and only the first
        # may clear a previous docket. An empty --run-url, --to-accept or
        # --image-root reads as absent, so a workflow that published nothing gets
        # no link and no picture rather than a broken one.
        # shellcheck disable=SC2086
        $VARIANCE_COMMAND comment \
          --config "$VARIANCE_CONFIG" \
          --body-file "$RUNNER_TEMP/variance-comment.md" \
          --run-url "$VARIANCE_RUN_URL" \
          --to-accept "$VARIANCE_TO_ACCEPT" \
          --image-root "$VARIANCE_IMAGE_ROOT"

    - name: post the docket
      if: ${{ inputs.comment == 'true' && steps.run.outputs.exit-code != '2' }}
      shell: bash
      env:
        # Through the environment rather than interpolated into the command line:
        # a `${{ }}` expression is pasted into the script before bash sees it, so
        # a value carrying a quote would become shell syntax.
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VARIANCE_MARKER: ${{ steps.render.outputs.marker }}
        VARIANCE_ADOPT_UNKEYED: ${{ inputs.adopt-unkeyed-comment }}
      run: |
        # In a container job `github.action_path` is the runner's host path; the
        # container mounts the same tree elsewhere. `GITHUB_WORKSPACE` is the
        # mounted spelling and `github.workspace` the host's, so the prefix swap
        # is a no-op on a job that runs on the host.
        here="${{ github.action_path }}"
        host_root=$(dirname "$(dirname "${{ github.workspace }}")")
        here="$(dirname "$(dirname "$GITHUB_WORKSPACE")")${here#"$host_root"}"
        node "$here/post-comment.mjs" \
          --body-file "$RUNNER_TEMP/variance-comment.md" \
          --marker "$VARIANCE_MARKER" \
          --adopt-unkeyed "$VARIANCE_ADOPT_UNKEYED"

    - name: commit regenerated baselines
      if: ${{ inputs.commit-baselines == 'true' && steps.run.outputs.exit-code != '2' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        VARIANCE_CONFIG: ${{ inputs.config }}
        VARIANCE_BASELINES: ${{ steps.carry.outputs.baselines-root }}
        VARIANCE_PATHSPECS: ${{ steps.carry.outputs.baselines-pathspecs }}
        VARIANCE_MESSAGE: ${{ inputs.commit-message }}
        VARIANCE_BRANCH: ${{ github.head_ref }}
      run: |
        set -euo pipefail

        if [ -z "$VARIANCE_BASELINES" ]; then
          echo "::error::commit-baselines is on, but this config keeps no baselines in the checkout: a remote store keeps them on the service, and ephemeral retention renders both sides in one run and keeps nothing"
          exit 2
        fi

        if [ -z "$VARIANCE_BRANCH" ]; then
          echo "::error::commit-baselines needs a pull_request event; this one has no head branch"
          exit 2
        fi

        # The check that prevents the worst outcome this step can produce. On a
        # `pull_request` event `actions/checkout` leaves the workspace on a
        # detached merge commit, and pushing from there would put the merge — not
        # the contributor's work — on their branch. The workflow has to check out
        # the head ref explicitly; refusing here is how that requirement becomes
        # visible instead of becoming a corrupted branch.
        current="$(git rev-parse --abbrev-ref HEAD)"
        if [ "$current" != "$VARIANCE_BRANCH" ]; then
          echo "::error::the workspace is on '$current', not '$VARIANCE_BRANCH'; give actions/checkout the pull request head ref before enabling commit-baselines, because pushing from a merge ref would rewrite the branch with the merge"
          exit 2
        fi

        # `--message-file`, so the commit says what the change *was* rather than
        # that baselines were regenerated. Prose for whoever scrolls `git log`,
        # opaque trailers for `variance changelog` a month later. The message is
        # written here and committed below, because `accept` promotes images and
        # deliberately owns no branch policy.
        message="$(mktemp)"

        # shellcheck disable=SC2086
        $VARIANCE_COMMAND accept --config "$VARIANCE_CONFIG" --all \
          --message-file "$message" --message "$VARIANCE_MESSAGE"

        # The paths `baselines.path` renders, never the root: collocated, the
        # root is the repository. Listed first, because `git add` refuses a
        # pathspec that matches nothing and the old layout's usually does not.
        # `--cached` lists a pair `accept` retired, so it is staged as a
        # deletion beside the file it moved to, and git shows a rename.
        # A CLI older than this action prints no pathspecs, and an empty one
        # matches the whole checkout, so that CLI's root is staged as before.
        if [ -z "$VARIANCE_PATHSPECS" ]; then
          git add -- "$VARIANCE_BASELINES"
        else
          # A read loop, not `mapfile`: a self-hosted macOS runner's bash is 3.2.
          pathspecs=()
          while IFS= read -r spec; do
            if [ -n "$spec" ]; then pathspecs+=("$spec"); fi
          done <<< "$VARIANCE_PATHSPECS"
          listed="$(mktemp)"
          if [ "${#pathspecs[@]}" -gt 0 ]; then
            git ls-files -z --cached --others --exclude-standard -- "${pathspecs[@]}" > "$listed"
          fi
          # Only a list with something in it: `git add` given no pathspec at
          # all stages the whole tree. Literal, because a listed file name is
          # a name, and `Primary[1]` read as a pattern is another file.
          if [ -s "$listed" ]; then
            git --literal-pathspecs add -A --pathspec-from-file="$listed" --pathspec-file-nul
          fi
        fi

        if git diff --cached --quiet; then
          echo "no baseline changed; nothing to commit"
          exit 0
        fi

        # One commit, containing image artifacts and the sidecars without which an
        # image is not a baseline — the sidecar carries the width, the scale, and
        # the document digest that `settle` compares against on the next run —
        # and, for `lfs`, the `.gitattributes` line that tracks them. A staged
        # path that is none of these is a bug in this step, and it stops here
        # rather than riding into a contributor's branch.
        unexpected="$(git diff --cached --name-only | grep -Ev '(\.(png|webp|json)|(^|/)\.gitattributes)$' || true)"
        if [ -n "$unexpected" ]; then
          echo "::error::refusing to commit non-artifact paths staged under the baseline store"
          echo "$unexpected"
          exit 2
        fi

        # `-F`, and a fallback to `-m`. `accept` writes no message when nothing
        # was accepted or when the report could not name its run — and there is
        # still a staged baseline here, since `git diff --cached` said so. A
        # commit that failed because the explanation was missing would leave the
        # promoted images uncommitted with nothing saying why.
        if [ -s "$message" ]; then
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -F "$message"
        else
          echo "::warning::no changelog message was written for this update; committing without one"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "$VARIANCE_MESSAGE"
        fi

        git push origin "HEAD:refs/heads/$VARIANCE_BRANCH"

    # Saved under this commit and this run, so the next comparison restores this
    # store and not an older one. An Actions cache key is never overwritten,
    # which is why the key names the run: accepting the same commit twice must
    # keep the second. Kept whatever the gate found: the accept is the person's
    # answer, and a subject that rendered differently on the gate's pass is that
    # subject's defect, named by the red check, not a reason to drop every other
    # subject's baseline. `!cancelled()`, so a report, an image or a comment
    # step that failed after the gate cannot drop the accept either.
    - id: keep
      if: ${{ !cancelled() && inputs.accept == 'true' && steps.promote.outcome == 'success' }}
      name: what the host keeps
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        VARIANCE_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        $VARIANCE_COMMAND carry save --config "$VARIANCE_CONFIG" --format github >> "$GITHUB_OUTPUT"

    - id: saved
      if: ${{ !cancelled() && steps.keep.outputs.baselines-key != '' }}
      name: keep the accepted baselines for every run after this one
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.keep.outputs.baselines-path }}
        key: ${{ steps.keep.outputs.baselines-key }}

    - name: verdict
      # `always()`, so the exit code still decides the check even if the comment
      # step failed. A comment that could not be posted is a real failure and the
      # job carries it anyway — a failed earlier step fails a composite action
      # regardless of what this one returns — but it must not be able to *hide*
      # the verdict by aborting before it is stated.
      if: ${{ always() }}
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code || steps.doctor.outputs.exit-code }}
        KEPT: ${{ steps.saved.outcome == 'success' }}
        EXIT_ZERO_ON_CHANGES: ${{ inputs.exit-zero-on-changes }}
        REPORT: ${{ steps.carry.outputs.report }}
        # Where the reader goes next. A push has no pull request, so pointing at
        # a comment there sends them looking for something that was never written.
        WHERE: >-
          ${{ inputs.comment == 'true' && 'the docket is in the pull request comment' ||
          steps.upload.outputs.artifact-url && format('the report is at {0}', steps.upload.outputs.artifact-url) ||
          'the report is in the variance run step above' }}
      run: |
        case "${CODE:-}" in
          0)
            echo "nothing needs review."
            ;;
          1)
            if [ "$KEPT" = true ]; then
              # The run accepted, and kept it: what failed, failed against
              # this commit's own accept.
              echo "::error::variance kept what this run accepted, and the comparison after it still failed: a subject that does not render the same way twice, an observation that errored, or a subject not observed; $WHERE."
            elif [ "$EXIT_ZERO_ON_CHANGES" = true ]; then
              # A change is the reviewer's to look at whenever they get to it;
              # a subject the run could not observe is a hole in what it says,
              # often a server that died mid-run, and stays red. Of the
              # conditions `exitFor` turns into 1, the holes are a `failed`
              # subject, an `error` diagnostic and a report that does not say
              # what it observed or skipped; an unreadable one is a hole too.
              # An unabsorbed instability is left a change on purpose: on an
              # ordinary run that subject is already `changed`.
              if node -e '
                const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
                const hole = report.observations === undefined || report.notObserved === undefined ||
                  report.notObserved.some((entry) => entry.kind === "failed") ||
                  report.observations.some(({ diagnostics }) => (diagnostics ?? []).some((d) => d.severity === "error"));
                process.exit(hole ? 1 : 0);
              ' "${REPORT:-}" 2>/dev/null; then
                echo "::warning::variance found changes that need review; $WHERE."
                exit 0
              fi
              echo "::error::variance could not observe every subject: a subject failed, an observation errored, or the report does not say what it skipped; $WHERE."
            else
              echo "::error::variance found changes that need review; $WHERE."
            fi
            exit 1
            ;;
          2)
            # Not a finding about the change: no verdict was reached and no
            # subject was observed.
            echo "::error::variance could not run (exit 2); see the doctor or the variance run step above."
            exit 2
            ;;
          '')
            echo "::error::variance run never reported an exit code; the step that failed above says why."
            exit 2
            ;;
          *)
            echo "::error::variance exited $CODE, which is not one of its three codes; treating it as a failure."
            exit "$CODE"
            ;;
        esac
