name: proof-tick
# Throwaway. Measures how a tick can reach the pull request's cache scope.
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      mode:
        type: string
        default: tick
      job:
        type: string
        default: ''
      sha:
        type: string
        default: ''
permissions:
  contents: read
  actions: write
  pull-requests: write
  statuses: write
jobs:
  gate:
    if: github.event_name == 'pull_request' || inputs.mode == 'gate'
    runs-on: ubuntu-24.04
    steps:
      - name: context
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA head=${{ github.event.pull_request.head.sha }}"
          echo "attempt=$GITHUB_RUN_ATTEMPT run=$GITHUB_RUN_ID actor=${{ github.actor }} triggering=${{ github.triggering_actor }}"
          echo "action=${{ github.event.action }} check_run_id=$CHECK_RUN_ID"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: store
          key: proof-tick-none
          restore-keys: proof-tick-
      - name: what the store holds
        run: |
          echo "matched=${{ steps.restore.outputs.cache-matched-key }}"
          ls -la store 2>/dev/null && cat store/* || echo 'no store'
      - name: save this attempt
        run: mkdir -p store && echo "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT $GITHUB_REF" >> store/log
      - uses: actions/cache/save@v4
        with:
          path: store
          key: proof-tick-${{ github.run_id }}-${{ github.run_attempt }}
      - name: red on the first attempt
        run: test "$GITHUB_RUN_ATTEMPT" != 1
  slow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - run: sleep 420
  tick:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'tick'
    runs-on: ubuntu-24.04
    steps:
      - name: asks as a tick handler would
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
          SHA: ${{ inputs.sha }}
        run: |
          echo "--- permission of a writer"
          gh api "repos/$GITHUB_REPOSITORY/collaborators/thearnica/permission" --jq '{permission,role_name}' || true
          echo "--- permission of a stranger"
          gh api "repos/$GITHUB_REPOSITORY/collaborators/octocat/permission" --jq '{permission,role_name}' || true
          echo "--- permission of the bot"
          gh api "repos/$GITHUB_REPOSITORY/collaborators/github-actions%5Bbot%5D/permission" --jq '{permission,role_name}' || true
          echo "--- check runs on head"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=gate" --jq '.check_runs[]|{id,name,status,conclusion,details_url}' || true
          echo "--- rerun the job"
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB/rerun" -i | head -20 || true
