# Versioning happens on merge. Publishing happens when somebody says so.
#
# These are two jobs with two triggers, and the separation is the whole point:
#
#   a merge          → open or update one "Version packages" pull request
#   that PR merged   → the manifests and changelogs move. Nothing is published.
#   Run workflow ▸   → publish what `main` currently carries, and tag it
#
# No merge reaches npm. Not a contributor's, not the version pull request's, not
# one landed by auto-merge at three in the morning. The registry is reached by a
# person opening this workflow and pressing the button, and by nothing else.
#
# That costs one click per release and buys the thing a click cannot be given
# back: a published version is unpublishable, an npm dist-tag is what every
# `yarn add` in the world resolves, and "who merged that" is not a recovery plan.
#
# Nothing here holds an npm token. The publish job authenticates by exchanging
# GitHub's OIDC token for a short-lived registry credential, which the registry
# grants only to this repository, this workflow file and the `npm` environment,
# because that is what the trusted publisher on each package names. It also
# means the tarballs carry provenance: a signed statement of which commit and
# which workflow built them, which a consumer can verify without trusting us.
# Granular tokens that bypass two-factor lose the ability to publish in January
# 2027 in any case, so a token here would be a thing to migrate off later.
#
# A trusted publisher is configured on a package that already exists, so the
# first version of a *new* name — each of the three
# `@variance-authority/sense-<platform>` packages, the next time a package is
# added — is published by a person from a machine, once, and the publisher is
# configured afterwards. This workflow cannot bootstrap a name it has never
# published; it will fail the exchange and say so.
#
# The version itself is derived — `.changeset/config.json` holds all packages in
# one `fixed` group, because they are one product with `workspace:^` between
# them. `changeset publish` reads the package manager from the workspace and
# runs `yarn npm publish`, which matters: npm would ship that protocol verbatim
# and break every install. It publishes in dependency order, skips versions the
# registry already has — so a second press is a no-op, not a disaster — and takes
# the dist-tag from the version each manifest carries rather than from anything
# typed here.

name: release

on:
  push:
    branches: [main]
    # An ordinary merge changes neither of these and does not start anything. A
    # merge carrying a changeset adds a file under `.changeset/`; the version
    # pull request removes those and raises every manifest.
    paths:
      - '.changeset/**'
      - 'packages/*/package.json'
  workflow_dispatch:

concurrency: release

jobs:
  # ---------------------------------------------------------------------------
  # On merge: collect the changesets into one reviewable version commit.
  # Publishes nothing, holds no npm token, and could not publish if it wanted to.
  # ---------------------------------------------------------------------------
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `changelog-git` names the commit each changeset arrived
          # in, and a shallow checkout does not have them.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: yarn install --immutable

      # No build, no `yarn verify`. This job writes version numbers and
      # changelogs; `check.yml` already runs lint, checks and tests on this same
      # commit across two Node versions.
      - uses: changesets/action@v1
        with:
          version: yarn release:version
          commit: 'Version packages'
          title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # On the button: compile the scanner once per platform we publish one for.
  #
  # Three runners, three `@variance-authority/sense-<platform>` packages, and
  # nothing built on an adopter's machine. `sense` names all three as optional
  # dependencies, so a package manager unpacks the one it matches and silently
  # skips the two it does not — which is also why a broken matrix is invisible
  # rather than red, and why `tools/native-packages.check.ts` exists.
  #
  # The matrix is deliberately three and not nine. The TypeScript scanner is the
  # implementation of record (ADR-0065), so a platform outside this list runs the
  # same scan more slowly and never a different one. That makes each addition a
  # thing to justify with a machine somebody actually ships from, rather than a
  # completeness exercise paid for on every release.
  #
  # One binary per platform, built for the oldest machine it must load on —
  # rustc's default for `aarch64-apple-darwin` is `apple-m1`, the floor of Apple
  # Silicon. Narrowing macOS to a later core was measured and did not pay, and it
  # could not have been done in place: `-C target-cpu=apple-m4` produces a
  # package that will not run on an M1 at all. What a newer Mac wants is a
  # different number of workers, which the scanner decides at runtime.
  # `packages/sense/scripts/tuned-cost.mjs` is what re-asks the code-generation
  # half of that when a generation lands.
  # ---------------------------------------------------------------------------
  native:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      # One platform failing to compile is a release that must not go out half
      # built, and a matrix that keeps going would spend ten minutes proving it.
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: win32-x64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The runners carry rustup; the toolchain file beside the crate pins the
      # channel. Only the target has to be asked for, and on the runner that is
      # already native to it this is a no-op.
      - run: rustup target add ${{ matrix.target }}

      # No `yarn install`. This builds a Rust crate and copies the result — it
      # needs neither the workspace's dependencies nor its `dist/`.
      - run: node packages/sense/native/build.mjs --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.platform }}
          # Every binary the platform built, because how many there are is the
          # build script's decision and not this file's.
          path: packages/sense/npm/${{ matrix.platform }}/*.node
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # On the button: publish what the manifests already carry.
  # ---------------------------------------------------------------------------
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: native
    # The environment name is load-bearing twice over: GitHub can hold the run
    # here for a reviewer, and npm's trusted publisher for every package names
    # this environment, this repository and this workflow's filename. Rename any
    # of the three and the registry refuses the exchange — which is the point,
    # but it makes `release.yml` and `npm` names that cannot be tidied.
    environment: npm
    permissions:
      contents: write
      # Trusted publishing: `yarn npm publish` trades this run's OIDC token for a
      # credential that lives seconds and cannot leave the runner. There is no
      # npm token in this repository to leak, rotate, or find expired on the one
      # evening a release matters.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: yarn install --immutable

      # A changeset still sitting in `.changeset/` means `main` carries changes
      # the version it would publish does not account for — the changelog would
      # be missing them and the version would understate what shipped. The fix is
      # to merge the version pull request, not to publish anyway.
      - name: Nothing is waiting to be versioned
        run: |
          shopt -s nullglob
          waiting=()
          for file in .changeset/*.md; do
            [ "$(basename "$file")" = README.md ] || waiting+=("$file")
          done
          if [ ${#waiting[@]} -gt 0 ]; then
            printf '%s\n' "unversioned changesets on main:" "${waiting[@]}"
            echo "merge the version pull request first — its diff is what this would publish"
            exit 1
          fi

      # `dist` is gitignored and the only `prepack` any package declares refuses
      # a missing binary rather than producing one, so this is what makes the
      # tarballs non-empty. A publish from a clean checkout without it ships
      # empty packages.
      - run: yarn build

      # After the build, deliberately. `yarn build` runs the native build script,
      # which on this runner would compile a fourth Linux binary over the one the
      # matrix produced — so the download goes last and the bytes that ship are
      # the bytes that were built on the platform they are for.
      - uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: native-artifacts

      - name: Every platform package carries its binaries
        run: |
          wrong=()
          for platform in darwin-arm64 linux-x64-gnu win32-x64-msvc; do
            # Each manifest's `files` is the list, so a package that gains a
            # second binary is guarded here without this file being edited.
            for binary in $(node -p "require('./packages/sense/npm/$platform/package.json').files.join(' ')"); do
              from="native-artifacts/scan-$platform/$binary"
              # A truncated upload publishes a package that resolves and will not
              # load, which the loader catches and nobody ever sees. The scanner
              # is megabytes; anything under one is not one.
              if [ ! -s "$from" ] || [ "$(wc -c <"$from")" -lt 1000000 ]; then
                wrong+=("$platform/$binary")
                continue
              fi
              cp "$from" "packages/sense/npm/$platform/$binary"
            done
          done
          if [ ${#wrong[@]} -gt 0 ]; then
            printf '%s\n' "no usable scanner was built for:" "${wrong[@]}"
            exit 1
          fi
          ls -l packages/sense/npm/*/*.node

      - run: yarn verify

      - name: Publish, and tag what was published
        env:
          # No token, deliberately. Yarn attempts the OIDC exchange when no
          # credential is configured, so adding one back here would silently
          # disable trusted publishing rather than fail.
          YARN_NPM_PUBLISH_PROVENANCE: 'true'
        run: |
          yarn release:publish
          # Tags come from `changeset publish` and name versions the registry has
          # already accepted, so pushing them cannot describe a release that did
          # not happen.
          git push --tags
