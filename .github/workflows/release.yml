# Versioning happens on merge. Publishing happens when somebody says so.
#
# These are two jobs with two triggers, and the separation is the whole point:
#
#   a merge          → open or update one "Version packages" pull request
#   that PR merged   → the manifests and changelogs move. Nothing is published.
#   Run workflow ▸   → publish what `main` currently carries, and tag it
#
# No merge reaches npm. Not a contributor's, not the version pull request's, not
# one landed by auto-merge at three in the morning. The registry is reached by a
# person opening this workflow and pressing the button, and by nothing else.
#
# That costs one click per release and buys the thing a click cannot be given
# back: a published version is unpublishable, an npm dist-tag is what every
# `yarn add` in the world resolves, and "who merged that" is not a recovery plan.
#
# The publish job holds no npm token. npm no longer issues one that publishes
# without a second factor, so a token here is refused at best. It is trusted
# publishing: the job exchanges GitHub's OIDC token for a registry credential
# that lives seconds, which the registry grants only to this repository, this
# workflow file and the `npm` environment, because that is what the trusted
# publisher on each package names. It is configured one package at a time with
# `npm trust github <name> --file release.yml --repo
# Variance-Authority/variance-authority --env npm --allow-publish`, and the
# account must carry two-factor authentication before the registry will accept
# any of it.
#
# A trusted publisher is configured on a package that already exists, so this
# workflow cannot create a name: not the `@variance-authority/sense-<platform>`
# packages once, not the next package added. `green` refuses while npm has
# never held one, before anything publishes, and `node tools/publish.mjs
# --placeholders`, run once by a person logged in to npm, creates it as a bare
# manifest at a version no release carries and configures its publisher.
#
# The version itself is derived — `.changeset/config.json` holds all packages in
# one `fixed` group, because they are one product with `workspace:^` between
# them. `changeset pack` packs with Yarn, which matters: the tarball carries the
# version `workspace:^` names, where npm packing would ship that protocol
# verbatim and break every install. npm publishes those tarballs, in the
# dependency order changesets planned, skipping versions the registry already
# has — so a second press is a no-op, not a disaster — at the dist-tag changesets
# took from the version each manifest carries rather than from anything typed
# here.

name: release

on:
  push:
    branches: [main]
    # An ordinary merge changes neither of these and does not start anything. A
    # merge carrying a changeset adds a file under `.changeset/`; the version
    # pull request removes those and raises every manifest.
    paths:
      - '.changeset/**'
      - 'packages/*/package.json'
  workflow_dispatch:

concurrency: release

jobs:
  # ---------------------------------------------------------------------------
  # On merge: collect the changesets into one reviewable version commit.
  # Publishes nothing, holds no npm token, and could not publish if it wanted to.
  # ---------------------------------------------------------------------------
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `changelog-git` names the commit each changeset arrived
          # in, and a shallow checkout does not have them. With its trees: the
          # answer is a log filtered by path, which reads a tree per commit, and
          # a clone without them would fetch each one in its own request.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: yarn install --immutable

      # No build, no `yarn verify`. This job writes version numbers and
      # changelogs; `check.yml` already runs lint, checks and tests on this same
      # commit across two Node versions.

      # No `publish-script`, which is what keeps this job unable to reach the
      # registry: the action publishes only when given one. v2 renamed every
      # input and takes the token as an input rather than from the environment.
      - uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: yarn release:version
          commit-message: 'Version packages'
          pr-title: 'Version packages'

  # ---------------------------------------------------------------------------
  # On the button, first: is this commit one `main` can release?
  #
  # `check` ran every file on it when it reached `main`; a press asks for that
  # answer rather than running the suite again in one worker. A commit `check`
  # never saw pushed to `main` has no answer and does not release. The platforms
  # compile alongside it, so a press made while `check` still runs costs the
  # longer of the two, and `publish` waits for both.
  # ---------------------------------------------------------------------------
  green:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The deadline for a `check` that never finishes; one that started at the
    # merge has long since answered.
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: yarn install --immutable

      # One version across every package, which is what the `fixed` group in
      # `.changeset/config.json` promises, and no changeset naming a package
      # still waiting for it: publishing past one would ship changes the
      # version does not account for. The fix for either is the version pull
      # request, not publishing anyway. Asked before the wait, because it
      # answers in seconds.
      - name: One version, and nothing waiting for one
        run: node tools/released.mjs --lockstep

      # npm adds a trusted publisher only to a package that exists, so this
      # workflow cannot publish a name for the first time, and finding out
      # mid-publish leaves the release in part. A new name is created once as
      # a placeholder by `node tools/publish.mjs --placeholders`, which gives
      # it its trusted publisher; the refusal says so.
      - name: npm has held every name before
        run: node tools/released.mjs --named

      - name: main's CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow check.yml --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::\`check\` has not run on $GITHUB_SHA as a push to main — release from main"
            exit 1
          fi
          # Still running is a wait, not a refusal: the press comes minutes
          # after the merge, and the answer is minutes away.
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
          gh run watch -R "$GITHUB_REPOSITORY" "$run" --interval 30 --exit-status > /dev/null || {
            echo "::error::\`check\` did not pass on $GITHUB_SHA: $url"
            exit 1
          }
          echo "check passed on $GITHUB_SHA: $url"

  # ---------------------------------------------------------------------------
  # On the button: compile the scanner once per platform we publish one for.
  #
  # One runner per `@variance-authority/sense-<platform>` package, and nothing
  # built on an adopter's machine. `sense` names every one as an optional
  # dependency, so a package manager unpacks the one it matches and silently
  # skips the rest — which is also why a broken matrix is invisible
  # rather than red, and why `tools/native-packages.check.ts` exists.
  #
  # The matrix is four and not nine. Each row is a machine somebody runs this
  # on: a Mac, x64 CI, Windows, and Linux arm64 — which is Docker on Apple
  # Silicon and arm CI runners as much as it is a server. A platform outside the
  # list builds the addon locally, which `native/build.mjs` writes to where the
  # loader looks second.
  #
  # One binary per platform, built for the oldest machine it must load on —
  # rustc's default for `aarch64-apple-darwin` is `apple-m1`, the floor of Apple
  # Silicon. Narrowing macOS to a later core was measured and did not pay, and it
  # could not have been done in place: `-C target-cpu=apple-m4` produces a
  # package that will not run on an M1 at all. What a newer Mac wants is a
  # different number of workers, which the scanner decides at runtime.
  # `packages/sense/scripts/tuned-cost.mjs` is what re-asks the code-generation
  # half of that when a generation lands.
  # ---------------------------------------------------------------------------
  native:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      # One platform failing to compile is a release that must not go out half
      # built, and a matrix that keeps going would spend ten minutes proving it.
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: win32-x64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The runners carry rustup; the toolchain file beside the crate pins the
      # channel. Only the target has to be asked for, and on the runner that is
      # already native to it this is a no-op.
      - run: rustup target add ${{ matrix.target }}

      # Linux links against the glibc floor in `native/targets.mjs` rather than
      # the runner's own, which is what `cargo zigbuild` is for. Built on
      # ubuntu-latest without it, the scanner asked for glibc 2.39 and failed
      # to load on Debian 12 while Node and oxc ran there fine.
      - if: startsWith(matrix.platform, 'linux-')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - if: startsWith(matrix.platform, 'linux-')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # No `yarn install`. This builds a Rust crate and copies the result — it
      # needs neither the workspace's dependencies nor its `dist/`.
      - run: node packages/sense/native/build.mjs --target ${{ matrix.target }}

      # The same refusal `prepack` makes at publish, made here so a binary over
      # its glibc floor fails the platform that built it.
      - run: node packages/sense/scripts/verify-native-pack.mjs packages/sense/npm/${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.platform }}
          # Every binary the platform built, because how many there are is the
          # build script's decision and not this file's.
          path: packages/sense/npm/${{ matrix.platform }}/*.node
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # On the button: build the editor plugins `@variance-authority/editors` carries.
  #
  # The WebStorm plugin compiles against an IDE's own jars with that IDE's own
  # compiler, so the runner fetches one: the oldest release `plugin.xml` accepts,
  # because what compiles against the floor loads on everything above it. Both
  # plugins are stamped with the version this release publishes.
  # ---------------------------------------------------------------------------
  editors:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: yarn install --immutable

      # Only used when the IDE's bundled runtime carries no compiler.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: The oldest IDE the plugin declares
        run: |
          curl -fsSL https://download.jetbrains.com/webstorm/WebStorm-2025.1.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "IDE=$(ls -d "$RUNNER_TEMP"/WebStorm-*)" >> "$GITHUB_ENV"

      - run: node packages/editors/scripts/build.mjs "$IDE"

      # The same refusal `prepack` makes at publish, made where the plugins were built.
      - run: node packages/editors/scripts/verify-pack.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: editors
          path: |
            packages/editors/variance-authority.vsix
            packages/editors/variance-authority.jar
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # On the button: publish what the manifests already carry.
  # ---------------------------------------------------------------------------
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [green, native, editors]
    # The environment name is load-bearing twice over: GitHub can hold the run
    # here for a reviewer, and the trusted publisher on each package spells this
    # environment, this repository and this workflow's filename. Rename any of
    # the three and the registry will refuse the exchange — which is the point,
    # but it makes `release.yml` and `npm` names that cannot be tidied.
    environment: npm
    permissions:
      contents: write
      # What authenticates the publish and what signs it: `npm publish`
      # trades this run's OIDC token for a registry credential that lives
      # seconds and cannot leave the runner, and npm mints provenance from it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: yarn install --immutable

      # `dist` is gitignored and the `prepack` scripts packages declare refuse
      # a missing binary rather than producing one, so this is what makes the
      # tarballs non-empty. A publish from a clean checkout without it ships
      # empty packages. The TypeScript half only: the `native` matrix built every
      # scanner, and `build:native` here would spend minutes of cargo on a Linux
      # binary the download below overwrites.
      - run: yarn build:js

      - uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: native-artifacts

      # Into the package that carries them; its `prepack` refuses to publish without them.
      - uses: actions/download-artifact@v4
        with:
          name: editors
          path: packages/editors

      - name: Every platform package carries its binaries
        run: |
          wrong=()
          for platform in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            # Each manifest's `files` is the list, so a package that gains a
            # second binary is guarded here without this file being edited.
            for binary in $(node -p "require('./packages/sense/npm/$platform/package.json').files.join(' ')"); do
              from="native-artifacts/scan-$platform/$binary"
              # A truncated upload publishes a package that resolves and will not
              # load, which the loader catches and nobody ever sees. The scanner
              # is megabytes; anything under one is not one.
              if [ ! -s "$from" ] || [ "$(wc -c <"$from")" -lt 1000000 ]; then
                wrong+=("$platform/$binary")
                continue
              fi
              cp "$from" "packages/sense/npm/$platform/$binary"
            done
          done
          if [ ${#wrong[@]} -gt 0 ]; then
            printf '%s\n' "no usable scanner was built for:" "${wrong[@]}"
            exit 1
          fi
          ls -l packages/sense/npm/*/*.node

      - name: Publish, and tag what was published
        env:
          PACKED: ${{ runner.temp }}/packed
        # No credential is set, and that is what makes npm trade the run's OIDC
        # token: it attempts the exchange only when nothing else authenticates.
        # Setting a token here turns trusted publishing off.
        run: |
          # Yarn packs and npm publishes. `changeset pack` plans the release in
          # dependency order and packs each name with `yarn pack`, which
          # rewrites `workspace:^` and runs every `prepack`. `tools/publish.mjs`
          # sends each tarball with `npm publish --provenance`: Yarn's signing
          # client gives the transparency log five seconds and reads its own
          # retry's "an equivalent entry already exists" as a failure, which
          # cost 0.17.1 two names and 0.18.0 one to three on every attempt.
          yarn changeset pack --out-dir "$PACKED"

          # Once. npm answers a publish when it has accepted the version, and
          # shows it only after scanning it, so a version it holds and has not
          # shown is refused a second publish with 409 "previously staged" for
          # good: 0.19.0's retry sent `core` again, was refused, and held the
          # group behind it. `tools/publish.mjs` reads that refusal as the
          # version being npm's, and a name that failed any other way fails
          # this step here. Pressing the button again is the repair: it sends
          # what the registry does not show, and a version npm holds and has
          # not shown is refused again and read as held.
          node tools/publish.mjs "$PACKED"

          # A failed publish ends the step above; a green one is not believed
          # either, because 0.5.6 reached five of thirty-eight names from a
          # green step. The registry has the last word. It is given the scan's
          # time — 0.6.0 showed `core` six minutes after it was sent, and other
          # projects have seen npm hold one for seventeen.
          node tools/released.mjs --registry --wait 1200

          # `changeset tag` is the tagging `changeset publish` claims to have
          # done, asked for on its own. It names versions the registry has
          # accepted — verified one line above — and it is idempotent, so this
          # cannot invent a tag for a release that did not happen and cannot
          # fail on one that was already tagged.
          #
          # It writes annotated tags, and an annotated tag needs a tagger. With
          # no identity `git tag` refuses each one, `changeset tag` ignores the
          # refusal and prints "Created git tags", and the push finds nothing to
          # send: 0.8.0 reached the registry whole and origin with no tag.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          yarn changeset tag
          git push origin --tags

          # Both halves, for the record and for the next person reading a green
          # run: every name on the registry at this version, every tag on
          # origin. 0.5.8 published all thirty-eight and tagged none of them,
          # and nothing anywhere said so.
          node tools/released.mjs --wait 60

      # The action is installed the way every action is, by its own repository:
      # `uses: Variance-Authority/action@v<version>`, the version being the
      # CLI's it runs. This repository's token cannot push there, so the `npm`
      # environment holds a deploy key with write access to that repository as
      # `ACTION_DEPLOY_KEY`. Without it this step fails and the release is not
      # complete. Pressed again, it finds the tag it made and pushes nothing; a
      # remote it cannot read is a failure, never a tag it may write.
      - name: Publish the action to its own repository
        env:
          ACTION_DEPLOY_KEY: ${{ secrets.ACTION_DEPLOY_KEY }}
        run: |
          if [ -z "$ACTION_DEPLOY_KEY" ]; then
            echo "::error::ACTION_DEPLOY_KEY is not set, so Variance-Authority/action cannot be published."
            exit 1
          fi
          version="$(node -p "require('./packages/cli/package.json').version")"
          key="$RUNNER_TEMP/action-deploy-key"
          (umask 077 && printf '%s\n' "$ACTION_DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          remote=git@github.com:Variance-Authority/action.git

          # 0 is the tag, 2 is no such tag, anything else is a remote not read.
          found=0
          git ls-remote --exit-code "$remote" "refs/tags/v$version" >/dev/null || found=$?
          if [ "$found" = 0 ]; then
            echo "Variance-Authority/action already has v$version."
            exit 0
          elif [ "$found" != 2 ]; then
            echo "::error::Variance-Authority/action could not be read (git ls-remote exited $found)."
            exit 1
          fi

          # The repository holds the action and nothing else: what this release
          # ships under `.github/actions/variance`, and the licence.
          into="$RUNNER_TEMP/action"
          git clone --depth 1 "$remote" "$into"
          git -C "$into" config user.name 'github-actions[bot]'
          git -C "$into" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find "$into" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .github/actions/variance/. "$into/"
          cp LICENSE "$into/LICENSE"
          git -C "$into" add -A
          git -C "$into" commit --allow-empty -m "variance-authority $version"
          git -C "$into" tag -a "v$version" -m "variance-authority $version"
          git -C "$into" push origin HEAD:main "refs/tags/v$version"
