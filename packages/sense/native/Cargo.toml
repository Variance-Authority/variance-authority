[package]
name = "sense-native"
version = "0.0.0"
edition = "2021"
publish = false
description = "The scanning path of @variance-authority/sense, where a cold repository is the cost."

[lib]
crate-type = ["cdylib"]

# The tree-sitter grammars, which are the only part of this crate that can fail
# to build for a reason that is not ours. Each grammar ships a C parser compiled
# by a `cc` invocation on the adopter's or the runner's machine, so a toolchain
# the five generated parsers disagree with takes the whole scanner down with
# them — and the scanner is mostly oxc, which reads the languages this product
# is actually about.
#
# On by default, because a release that quietly dropped them would be a release
# that lost Python, Rust, Java, Kotlin and Swift. Off is a fallback the build
# script reaches for after the default build has already failed
# (`build.mjs`), and it costs exactly those five languages: `readLanguage`
# answers nothing, and `record.ts` records every file in them as unknown.
[features]
default = ["grammars"]
grammars = [
    "dep:tree-sitter",
    "dep:tree-sitter-java",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-swift",
]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
# The matcher `oxc_resolver` already builds, and the one rolldown reads a
# `sideEffects` glob with.
fast-glob = "1"
# The comment and trailing-comma stripper `oxc_resolver` reads a `tsconfig` with,
# so `customConditions` is read from the same text it parses.
json-strip-comments = "3"
oxc_allocator = { version = "0.144.0", features = ["pool"] }
oxc_ast = "0.144.0"
oxc_ast_visit = "0.144.0"
oxc_parser = "0.144.0"
oxc_resolver = "=11.24.2"
oxc_span = "0.144.0"
oxc_syntax = { version = "0.144.0", features = ["to_js_string"] }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = { version = "0.27", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
zstd = "0.13"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# `sha2` takes the ARMv8 SHA instructions only through its `asm` feature; without
# it every digest on Apple Silicon is the portable loop, at a fifth of the speed
# Node's OpenSSL hashes the same bytes. x86 detects SHA-NI without the feature,
# and enabling it there would swap that for an assembler MSVC does not build.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
