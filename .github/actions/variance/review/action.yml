name: variance review
description: >-
  Puts `variance review --coverage` on the pull request as one comment, updated
  in place, and marks each changed function no case covered on the diff, for a
  project with no surface for the gate to observe. It reads the
  record your tests left. It has no verdict unless `fail-on-uncovered` or `fail-on-lost` asks for
  one: the step fails when no review could be written, or when GitHub failed the
  post; a token that cannot write only warns.

inputs:
  suite:
    description: >-
      The declared suite the review reads. Needed when the root
      `variance.config.json` declares several, and for `against`, which coverage
      applies to a named suite alone.
    required: false
    default: ''

  against:
    description: >-
      The mainline record to compare `suite` with: the `against-<suite>` output
      of `variance carry take`. Left empty, a suite with `carry: share` is
      compared with the share's record and any other reads as having no baseline.
    required: false
    default: ''

  fail-on-uncovered:
    description: >-
      'true' fails the step when a changed function holds code no case ran, after
      the comment is posted, so a project can require the check.
    required: false
    default: 'false'

  fail-on-lost:
    description: >-
      'true' fails the step when a suite's base ran a region no case runs now,
      after the comment is posted, so a project can require the check.
    required: false
    default: 'false'

  command:
    description: >-
      How to invoke the CLI. Split on whitespace, so `node packages/cli/dist/bin.js`
      works as well as a bin on PATH.
    required: false
    default: npx --no-install variance

  badge:
    description: >-
      'true' publishes the figure `variance coverage` leads with, on a push to
      the default branch, as `regions-run.json` at `refs/badge/<branch>`, for a
      shields.io endpoint badge. The job then needs `contents: write`. For a
      public repository: raw.githubusercontent.com serves a private one to
      nobody a badge is shown to.
    required: false
    default: 'false'

  github-token:
    description: >-
      Token for the comment, which needs `pull-requests: write`, and for the
      badge, which needs `contents: write`.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # No `--config`: a project of suites alone holds no surface the parser accepts.
    - id: carry
      name: what the host carries
      shell: bash
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
      run: |
        # shellcheck disable=SC2086
        $VARIANCE_COMMAND carry restore --format github >> "$GITHUB_OUTPUT"

    # The source index comes first: under CI a reader refuses to build it on
    # demand.
    - id: review
      name: review the change
      shell: bash
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        SINCE: ${{ steps.carry.outputs.base }}
        SUITE: ${{ inputs.suite }}
        AGAINST: ${{ inputs.against }}
        REVIEW: ${{ steps.carry.outputs.review }}
        FAIL_ON_UNCOVERED: ${{ inputs.fail-on-uncovered }}
        FAIL_ON_LOST: ${{ inputs.fail-on-lost }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        $VARIANCE_COMMAND index
        fail=''
        [ "${FAIL_ON_UNCOVERED:-}" != true ] || fail=--fail-on-uncovered
        [ "${FAIL_ON_LOST:-}" != true ] || fail="$fail --fail-on-lost"
        status=0
        # shellcheck disable=SC2086
        $VARIANCE_COMMAND review ${SINCE:+--since "$SINCE"} ${SUITE:+--suite "$SUITE"} --coverage ${AGAINST:+--against "$AGAINST"} \
          $fail --out "$REVIEW" --format markdown >> "$GITHUB_STEP_SUMMARY" || status=$?
        # With the opt-in, 1 is a review written and a function no case ran: it is
        # posted, then fails the step below. Anything else is a review that did
        # not happen.
        [ "$status" = 0 ] || { [ "$status" = 1 ] && [ -n "$fail" ]; } || exit "$status"
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"

    # A failed review stops before this step, so the last comment stands. The
    # marker is read from the file: the command stays the one place it is spelled.
    - name: post the review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW: ${{ steps.carry.outputs.review }}
      run: |
        # In a container job `github.action_path` is the runner's host path; the
        # container mounts the same tree elsewhere. `GITHUB_WORKSPACE` is the
        # mounted spelling and `github.workspace` the host's, so the prefix swap
        # is a no-op on a job that runs on the host.
        here="${{ github.action_path }}"
        host_root=$(dirname "$(dirname "${{ github.workspace }}")")
        here="$(dirname "$(dirname "$GITHUB_WORKSPACE")")${here#"$host_root"}"
        node "$here/../post-comment.mjs" \
          --body-file "$REVIEW/review.md" \
          --marker "$(head -n 1 "$REVIEW/review.md")" \
          --adopt-unkeyed false
        node "$here/../diff-marks.mjs" "$REVIEW/review.json" || echo '::warning::The diff carries no marks: the comment holds what they would say.'

    # The figure the text of `variance coverage` leads with, every suite
    # together, in shields.io's endpoint schema, as the one file of a commit with
    # no parent: the ref is replaced on every push and never grows a history.
    # No figure, or a refused push, warns, and the last badge stands. Before the
    # failure on uncovered code, which would skip it.
    - name: publish the badge
      if: inputs.badge == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      env:
        VARIANCE_COMMAND: ${{ inputs.command }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -uo pipefail
        skip() { echo "::warning title=badge not updated::$1, so the last badge stands."; exit 0; }
        dir="$(mktemp -d)"
        # shellcheck disable=SC2086
        $VARIANCE_COMMAND coverage --format badge > "$dir/regions-run.json" || skip '`variance coverage` gave no figure'
        echo regions-run.json > "$dir/paths"
        # In a container job `github.action_path` is the runner's host path; the
        # container mounts the same tree elsewhere, as in the post above.
        here="${{ github.action_path }}"
        host_root=$(dirname "$(dirname "${{ github.workspace }}")")
        here="$(dirname "$(dirname "$GITHUB_WORKSPACE")")${here#"$host_root"}"
        # `|| pushed=$?`: GitHub runs the step under errexit, as in the images step.
        pushed=0
        bash "$here/../push-ref.sh" "$dir" "$dir/paths" "refs/badge/$BRANCH" "variance: regions run at $GITHUB_SHA" \
          "refs/heads/$BRANCH" "$GITHUB_SHA" > /dev/null || pushed=$?
        case $pushed in
          0) ;;
          2) skip "pushing refs/badge/$BRANCH was refused: the job needs \`contents: write\`" ;;
          3) skip "$BRANCH has moved past $GITHUB_SHA, and the newer commit's run publishes the badge" ;;
          *) skip "the badge could not be committed" ;;
        esac
        echo "regions run: $(cat "$dir/regions-run.json")" >> "$GITHUB_STEP_SUMMARY"

    # Last, because a step that fails skips the ones after it, and the comment
    # is what says which functions.
    - name: fail on what the review counted
      if: steps.review.outputs.exit-code == '1'
      shell: bash
      run: exit 1
