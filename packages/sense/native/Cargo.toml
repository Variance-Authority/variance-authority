[package]
name = "sense-native"
version = "0.0.0"
edition = "2021"
publish = false
description = "The scanning path of @variance-authority/sense, where a cold repository is the cost."

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
oxc_allocator = { version = "0.144.0", features = ["pool"] }
oxc_ast = "0.144.0"
oxc_parser = "0.144.0"
oxc_resolver = "=11.24.2"
oxc_span = "0.144.0"
oxc_syntax = "0.144.0"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
