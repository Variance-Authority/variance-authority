name: journey consumer smoke

on:
  push:
    branches: [codex/linux-consumer-smoke]

permissions:
  actions: read
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .github/consumer/journey-smoke

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install the published consumer packages
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run one Jest test
        run: npx --no-install jest --config jest.config.mjs --runInBand

      - name: Prove Jest left a pending recording
        run: |
          test -d .artifacts/journeys.bin.pending
          test ! -f .artifacts/journeys.bin
          find .artifacts/journeys.bin.pending -type f -print

      - name: Confirm the published native package is incomplete
        run: test ! -f node_modules/@variance-authority/sense-linux-x64-gnu/scan.node

      - name: Download the Linux binary built for the 0.5.5 release
        uses: actions/download-artifact@v4
        with:
          name: scan-linux-x64-gnu
          path: .github/consumer/journey-smoke/native
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35724433589

      - name: Supply the release binary missing from the npm package
        run: install -m 755 native/scan.node node_modules/@variance-authority/sense-linux-x64-gnu/scan.node

      - name: Prove the Linux addon loads
        run: node verify-native.cjs

      - name: Finalize after Jest
        run: npx --no-install variance journeys finalize "$PWD/.artifacts/journeys.bin"

      - name: Read the recording as a consumer
        run: node verify-recording.mjs

      - name: Upload the recording evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-consumer-smoke-${{ github.run_id }}
          path: .github/consumer/journey-smoke/.artifacts
          include-hidden-files: true
          if-no-files-found: error
