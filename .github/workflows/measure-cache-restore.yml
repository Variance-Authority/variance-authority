name: measure-cache-restore
on:
  push:
    branches: [measure/cache-restore]
permissions:
  contents: read
jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: a public Jest suite transformed by @swc/jest (Docusaurus)
        run: |
          git clone -q --depth 1 https://github.com/facebook/docusaurus /tmp/d
          set +e -x
          cd /tmp/d && git log -1 --format='docusaurus %H'
          grep -n packageManager package.json; yarn --version
          yarn install --frozen-lockfile > /tmp/install.log 2>&1; echo "install exit $?"; tail -15 /tmp/install.log
          ls -la node_modules/.bin/jest; nproc; grep -n -E "transform|swc" jest.config.* | head
          yarn build:packages > /tmp/build.log 2>&1; echo "build exit $?"; tail -10 /tmp/build.log
          node_modules/.bin/jest --ci --shard=1/3 --cacheDirectory /tmp/probe 2>&1 | grep -m1 -A25 "FAIL"
          rm -rf /tmp/probe; true
      - name: cold, warm, and restored shard 1/3
        run: |
          cd /tmp/d
          drop() { sync; echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null; }
          j() { drop; /usr/bin/time -f "$1: %e s real, %U s user, %S s sys" node_modules/.bin/jest --ci --silent --shard=1/3 --cacheDirectory /tmp/jc 2>&1 | grep -E "^(Tests:|Test Suites:|$1)"; }
          for r in 1 2; do
            rm -rf /tmp/jc
            j "cold $r"
            j "warm $r"
            echo "cache: $(find /tmp/jc -type f | wc -l) files, $(du -sm /tmp/jc | cut -f1) MB"
            tar -C /tmp/jc -cf - . | zstd -3 -q -o /tmp/jc.tar.zst -f; echo "pack: $(du -sm /tmp/jc.tar.zst | cut -f1) MB"
            rm -rf /tmp/jc; mkdir /tmp/jc; drop
            s=$(date +%s.%N); zstd -dc /tmp/jc.tar.zst | tar -xf - -C /tmp/jc; e=$(date +%s.%N); echo "restore $r: $(echo "$e - $s" | bc) s"
            j "restored $r"
          done
